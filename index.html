<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rain Arena</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#25282c;font-family:system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;color:#9aa0a8;font-size:13px;pointer-events:none}
  #hpbox{width:140px;height:12px;background:rgba(0,0,0,.6);border-radius:6px;overflow:hidden}
  #hp{height:100%;width:100%;background:#a33;transition:width .15s}
  #ggbox{width:140px;height:6px;margin-top:4px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden}
  #gg{height:100%;width:100%;background:#5a8fc7}
  #msg{text-align:right;line-height:1.4;white-space:pre-line}
  .btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center}
  .btn.on{background:rgba(255,255,255,.35)}
  #bl{left:18px}#br{left:106px}
  #bj{right:104px}#bp{right:18px;width:84px;height:84px;font-size:36px}
  #bs{right:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);width:70px;height:70px;font-size:28px}
  #brl{right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);width:58px;height:58px;font-size:24px;display:none}
  #inv{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:5}
  #invp{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:10}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;width:min(420px,94vw);max-height:88vh;overflow-y:auto;touch-action:pan-y}
  .grid *{touch-action:pan-y}
  .slot{background:#1b1d20;border:2px solid #3a3d42;border-radius:12px;padding:8px 4px;text-align:center;color:#ccc}
  .slot.sel{border-color:#c33}
  .si{font-size:28px}.sn{font-size:13px;margin-top:3px}.sa{font-size:11px;color:#8a9099;margin-top:2px}
  .pr{font-size:10px;color:#7fbf7f;margin-top:4px;line-height:1.25}
  .co{font-size:10px;color:#c47a7a;margin-top:2px;line-height:1.25}
  #wl{margin-top:6px}
  #nick{position:fixed;inset:0;background:rgba(10,12,14,.93);display:flex;align-items:center;justify-content:center;z-index:30}
  #nick .box{width:min(300px,86vw);text-align:center;color:#ccd}
  #nick .t{font-size:28px;letter-spacing:2px;margin-bottom:6px}
  #nick .s{font-size:12px;color:#8a9099;margin-bottom:18px}
  #ni{width:100%;padding:12px;font-size:18px;border-radius:10px;border:2px solid #3a3d42;background:#1b1d20;color:#fff;text-align:center;outline:none;user-select:text;-webkit-user-select:text;touch-action:auto}
  #go{margin-top:12px;width:100%;padding:12px;font-size:17px;border-radius:10px;border:0;background:#a33;color:#fff;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="hpbox"><div id="hp"></div></div><div id="ggbox"><div id="gg"></div></div><div id="wl"></div></div><div id="msg"></div></div>
<div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div>
<div class="btn" id="bj">⤒</div><div class="btn" id="bs">🛡️</div><div class="btn" id="bp">⚔️</div><div class="btn" id="brl">↻</div>
<div id="inv">🎒</div><div id="invp"></div>
<div id="nick"><div class="box"><div class="t">Rain Arena</div><div class="s">닉네임을 정하고 입장하세요</div><input id="ni" maxlength="8" placeholder="닉네임 (최대 8자)" autocomplete="off"><button id="go">입장</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== 설정: Supabase 프로젝트 값 ===== */
const SUPABASE_URL = "https://lunsgjjznfhfbtfcvoye.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_n7M5OMb_BIFAeJ0jdL9KBw_foAfZxeB";
/* ================================================== */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hpEl = document.getElementById('hp'), ggEl = document.getElementById('gg'), msgEl = document.getElementById('msg'), wlEl = document.getElementById('wl'), invp = document.getElementById('invp'), bpEl = document.getElementById('bp'), brlEl = document.getElementById('brl');
const WORLD = 3000, GRAV = 1500, SPEED = 190, JUMP = 560, PARRY = .16;
let W, H, DPR, scale;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  scale = Math.min(H / 420, W / 380);
}
addEventListener('resize', resize); resize();

/* ---------- 플레이어 ---------- */
const myId = Math.random().toString(36).slice(2, 8);
// lg: 잘린 다리 수(0~2) / gib: 분쇄됨 / rlOn,rlt: 장전 중, 경과 시간
const mk = (x) => ({x, y:0, vx:0, vy:0, f:1, hp:100, walk:0, moving:false, pt:-1, w:1, rc:0, pu:false, hitDone:false, flash:0, stun:0, tx:x, ty:0, seen:performance.now(), g:false, bf:0, bt:0, sw:false, n:'', arrows:[], lg:0, gib:false, rlOn:false, rlt:0, rlPrev:false, sd:0});
const me = mk(WORLD/2 + (Math.random()-.5)*600);
me.gt = 0; me.gg = 100; me.glock = false; me.pcd = 0; me.pOk = false; me.n = '플레이어';
const others = {};
let deadT = 0, started = false;

/* ---------- 무기 ----------
   dmg 데미지 / dur 전체 시간 / w1 휘두르기 시작 / w2 타격 시점 / reach 사거리
   kb 넉백 / st 경직 / gm 방패 파괴력 배율 / mv 이동속도 배율 / lc 다리 절단 확률
   rl 장전 시간(있으면 탄창식, 없으면 화살처럼 자동 회복)                          */
const WEAPONS = [
  {n:'단검',ic:'🗡️',t:'m',dmg:7, dur:.26,w1:.30,w2:.50,reach:46, kb:90, st:.12,gm:.5,mv:.9,len:16,lc:.05,
   pro:'초고속 · 느린 무기 끊기',con:'짧은 사거리 · 방패에 약함'},
  {n:'검',  ic:'⚔️',t:'m',dmg:14,dur:.46,w1:.30,w2:.55,reach:72, kb:280,st:.16,gm:1,mv:.6,len:34,lc:.15,
   pro:'무난한 균형',con:'특출난 점 없음'},
  {n:'창',  ic:'🔱',t:'m',dmg:12,dur:.64,w1:.40,w2:.60,reach:124,kb:160,st:.12,gm:.8,mv:.5,len:60,sp:1,lc:.1,
   pro:'최장 사거리 · 끝이 강함',con:'근접 약함 · 느림'},
  {n:'도끼',ic:'🪓',t:'m',dmg:26,dur:.85,w1:.50,w2:.66,reach:68, kb:360,st:.24,gm:2.0,mv:.3,len:36,ax:1,lc:.35,
   pro:'방패 파괴 · 다리 절단',con:'느린 선딜 · 끊기기 쉬움'},
  {n:'망치',ic:'🔨',t:'m',dmg:22,dur:1.1,w1:.60,w2:.72,reach:78, kb:700,st:.5,gm:1.4,mv:.12,len:32,hm:1,lc:0,
   pro:'큰 넉백 · 긴 기절',con:'매우 느림 · 빗나가면 위험'},
  {n:'활',  ic:'🏹',t:'r',dmg:13,cd:.8,max:8,rg:1.5,spd:900,g:220,life:1.0,kb:140,st:.1,gm:1,mv:1,len:0,lc:.45,
   pro:'원거리 · 이동하며 사격',con:'근접 약함 · 화살 제한'},
  {n:'기관단총',ic:'🔫',t:'r',smg:1,dmg:4,cd:.1,max:30,rl:1.8,spd:1150,g:30,life:.65,kb:35,st:.02,gm:.6,mv:.85,len:0,lc:.25,
   pro:'빠른 연사 · 이동 사격',con:'낮은 위력 · 장전 필요'},
  {n:'바주카',ic:'🚀',t:'r',rk:1,dmg:70,cd:1.2,max:1,rl:2.4,spd:700,g:60,life:2.2,kb:520,st:.55,gm:3,mv:.55,len:0,
   pro:'맞으면 분쇄 · 광역 폭발',con:'단발 · 느린 장전 · 느린 탄'},
];
me.ammo = WEAPONS.map(w => w.max || 0); me.cd = 0;
const bullets = [], muz = [], regen = [];

/* ---------- 이펙트 상태 ---------- */
const craters = [], debris = [], dust = [], streaks = [], rings = [];
const sparks = [], bursts = [], texts = [], blood = [], mists = [], stains = [], gibs = [], fires = [];
let shake = 0, slow = 0, ifl = 0, rainWind = 0;

// 크레이터가 반영된 지면 높이 (아래쪽이 +)
function craterH(c, d){
  const u = d / c.r;
  if (u < 1){ const v = 1 - u * u; return c.d * c.k * v * v; }
  if (u < 1.45) return -c.d * c.k * .2 * Math.sin((u - 1) / .45 * Math.PI);
  return 0;
}
function gy(x){
  let h = 0;
  for (let i = 0; i < craters.length; i++){
    const c = craters[i], d = Math.abs(x - c.x);
    if (d < c.r * 1.45) h += craterH(c, d);
  }
  return h;
}

/* ---------- 입력 ---------- */
const keys = {L:false, R:false, A:false, S:false};
let wantJump = false;
function bindBtn(id, down, up){
  const el = document.getElementById(id);
  const d = e => { e.preventDefault(); el.classList.add('on'); down(); };
  const u = e => { e.preventDefault(); el.classList.remove('on'); up && up(); };
  el.addEventListener('pointerdown', d);
  ['pointerup','pointercancel','pointerleave'].forEach(t => el.addEventListener(t, u));
}
bindBtn('bl', () => keys.L = true,  () => keys.L = false);
bindBtn('br', () => keys.R = true,  () => keys.R = false);
bindBtn('bj', () => wantJump = true, () => wantJump = false);
bindBtn('bp', () => keys.A = true, () => keys.A = false);
bindBtn('bs', () => keys.S = true, () => keys.S = false);
bindBtn('brl', () => startReload());
const isG = k => ['l','L','s','S','Shift'].includes(k);
addEventListener('keydown', e => {
  if (!started || e.repeat) return;
  if (['ArrowLeft','a','A'].includes(e.key)) keys.L = true;
  if (['ArrowRight','d','D'].includes(e.key)) keys.R = true;
  if (['ArrowUp','w','W',' '].includes(e.key)) wantJump = true;
  if (['j','J','k','K'].includes(e.key)) keys.A = true;
  if (isG(e.key)) keys.S = true;
  if (e.key >= '1' && e.key <= '8') selW(+e.key - 1);
  if (e.key === 'r' || e.key === 'R') startReload();
  if (e.key === 'i' || e.key === 'I') toggleInv();
});
addEventListener('keyup', e => {
  if (['ArrowLeft','a','A'].includes(e.key)) keys.L = false;
  if (['ArrowRight','d','D'].includes(e.key)) keys.R = false;
  if (['ArrowUp','w','W',' '].includes(e.key)) wantJump = false;
  if (['j','J','k','K'].includes(e.key)) keys.A = false;
  if (isG(e.key)) keys.S = false;
});
function attack(){
  if (me.hp <= 0 || me.cd > 0 || me.pt >= 0 || me.stun > 0 || me.g || me.rlOn) return;
  const wp = WEAPONS[me.w];
  if (wp.t === 'm'){ me.pt = 0; me.hitDone = false; me.sw = false; me.cd = wp.dur + .06; sendState(true); return; }
  if (me.ammo[me.w] < 1){ startReload(); return; }
  me.ammo[me.w]--; me.cd = wp.cd; me.rc = wp.rk ? .2 : wp.smg ? .05 : .12;
  const sh = me.lg >= 2 ? 14 : 58;                 // 기어 다니면 낮게 쏨
  spawnShot(me.x, me.y, me.f, me.w, true, sh, myId);
  if (wp.smg) sndSmg(1);
  else if (wp.rk){ sndBazooka(1); shake = Math.max(shake, 8); me.vx -= me.f * 160; }
  else twang(1);
  if (online) channel.send({type:'broadcast', event:'b', payload:{i:myId, x:me.x, y:me.y, f:me.f, k:me.w, sh}});
  if (wp.rl && me.ammo[me.w] < 1) startReload();   // 탄창 비면 자동 장전
}
function spawnShot(x, y, f, k, own, sh, sid){
  const wp = WEAPONS[k]; if (!wp || wp.t !== 'r') return;
  sh = sh || 58;
  const vy = wp.smg ? (Math.random() - .5) * 70 : wp.rk ? -15 : -45, ox = wp.rk || wp.smg ? 36 : 30;
  bullets.push({x:x + f * ox, y:y - sh, vx:wp.spd * f, vy, life:wp.life, own, dmg:wp.dmg, kb:wp.kb, st:wp.st, gm:wp.gm, f, g:wp.g, sx:x, k, smg:!!wp.smg, rk:!!wp.rk, sid});
  muz.push({x:x + f * (ox + 4), y:y - sh, t:.08});
}
/* ---------- 장전 ---------- */
function startReload(){
  const wp = WEAPONS[me.w];
  if (!wp.rl || me.rlOn || me.hp <= 0 || me.ammo[me.w] >= wp.max) return;
  me.rlOn = true; me.rlt = 0; reloadSfx(wp, 1); sendState(true);
}
function reloadSfx(wp, v){
  [[.14,0],[.78,1],[.9,2]].forEach(([k, n]) => setTimeout(() => click(v, n), wp.rl * 1000 * k));
}
function click(v, n){
  if (!ac || v <= 0) return;
  tn(n === 2 ? 900 : 480, 260, .06, .28 * v, 'square'); nz(.04, 2400, 'highpass', .28 * v, 2);
}
function renderInv(){
  invp.innerHTML = '<div class="grid">' + WEAPONS.map((w, i) =>
    '<div class="slot' + (i === me.w ? ' sel' : '') + '" data-i="' + i + '"><div class="si">' + w.ic + '</div><div class="sn">' + w.n + '</div>' +
    '<div class="pr">+ ' + w.pro + '</div><div class="co">− ' + w.con + '</div>' +
    (w.t === 'r' ? '<div class="sa">' + me.ammo[i] + '/' + w.max + '</div>' : '') + '</div>').join('') + '</div>';
}
function toggleInv(){ const on = invp.style.display !== 'flex'; invp.style.display = on ? 'flex' : 'none'; if (on) renderInv(); }
function selW(i){
  if (!WEAPONS[i]) return;
  me.w = i; me.pt = -1; me.sw = false; me.rlOn = false;
  bpEl.textContent = WEAPONS[i].ic; brlEl.style.display = WEAPONS[i].rl ? 'flex' : 'none';
  invp.style.display = 'none'; sendState(true);
}
invp.addEventListener('click', e => { const sl = e.target.closest('.slot'); if (sl) selW(+sl.dataset.i); else toggleInv(); });
document.getElementById('inv').addEventListener('pointerdown', e => { e.preventDefault(); toggleInv(); });
bpEl.textContent = WEAPONS[me.w].ic;

/* ---------- 닉네임 ---------- */
const niEl = document.getElementById('ni'), nickEl = document.getElementById('nick');
try { niEl.value = localStorage.getItem('ra_nick') || ''; } catch(e){}
function startGame(){
  let n = niEl.value.trim().slice(0, 8);
  if (!n) n = '플레이어' + Math.floor(10 + Math.random() * 90);
  me.n = n;
  try { localStorage.setItem('ra_nick', n); } catch(e){}
  nickEl.style.display = 'none';
  started = true;
  initAudio();
  connect();
}
document.getElementById('go').addEventListener('click', startGame);
niEl.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });

/* ---------- 충격 이펙트 (망치 내려치기 / 폭발) ---------- */
function impactFx(x, f, ground, s){
  s = s || 1;
  const gh = gy(x);
  rings.push({x, y:gh - 56, f, t:0, s});
  const ns = Math.ceil(14 * s);
  for (let i = 0; i < ns; i++) streaks.push({x:x + f * Math.random() * 18, y:gh - 8 - Math.random() * 100 * s, vx:f * (700 + Math.random() * 600) * s, len:(30 + Math.random() * 60) * s, t:0});
  for (let i = 0; i < Math.ceil(12 * s); i++) dust.push({x:x + (Math.random() - .5) * 40, y:gh - 4, vx:f * (80 + Math.random() * 280) * s + (Math.random() - .5) * 60, vy:-Math.random() * 70, r:(5 + Math.random() * 6) * s, t:0, max:.5 + Math.random() * .5});
  if (ground){
    const r = (68 + Math.random() * 16) * s, cracks = [];
    for (let i = 0; i < 9; i++){
      const side = i % 2 ? 1 : -1, pts = [], n = 3 + Math.floor(Math.random() * 3);
      for (let j = 0; j < n; j++) pts.push([side * (Math.random() * 18 - 3), 5 + Math.random() * 10]);
      cracks.push({x:side * r * (.3 + Math.random() * 1.1), p:pts});
    }
    if (craters.length >= 14) craters.shift();
    craters.push({x, r, d:(24 + Math.random() * 6) * s, age:0, life:26, k:0, cracks});
    for (let i = 0; i < Math.ceil(20 * s); i++) debris.push({x:x + (Math.random() - .5) * 50, y:gh - 2, vx:(Math.random() - .5) * 320 + f * 160, vy:-(260 + Math.random() * 520) * s, s:2.5 + Math.random() * 5, rot:Math.random() * 6, vr:(Math.random() - .5) * 14, t:0, life:1.4 + Math.random() * .8});
  }
  const near = Math.max(0, 1 - Math.abs(x - me.x) / 900);
  if (near > 0){
    shake = Math.max(shake, 20 * near * s);
    ifl = Math.max(ifl, .2 * near * s);
    rainWind = f * 2.2 * near * s;
    boom(near * s);
    if (near > .5 && navigator.vibrate){ try { navigator.vibrate(45); } catch(e){} }
  }
}

/* ---------- 로켓 폭발 ---------- */
function explodeFx(x, y){
  const g = gy(x);
  fires.push({x, y:Math.min(y, g - 6), t:0, r:115});
  for (let i = 0; i < 34; i++){
    const a = Math.random() * 6.3, sp = 200 + Math.random() * 700;
    sparks.push({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 120, t:0, life:.3 + Math.random() * .5, w:1.4 + Math.random() * 2, c:Math.random() < .5 ? '255,170,60' : '255,220,140'});
  }
  for (let i = 0; i < 10; i++) dust.push({x:x + (Math.random() - .5) * 60, y:y + (Math.random() - .5) * 40, vx:(Math.random() - .5) * 160, vy:-Math.random() * 120, r:12 + Math.random() * 14, t:0, max:.8 + Math.random() * .6});
  impactFx(x, Math.random() < .5 ? 1 : -1, y > g - 70, 1.15);
  const v = Math.max(0, 1 - Math.abs(x - me.x) / 1100);
  if (v > 0){ shake = Math.max(shake, 26 * v); ifl = Math.max(ifl, .35 * v); sndExplode(v); }
}
// 폭발 판정은 쏜 사람 쪽에서: 폭심 가까우면 분쇄(bz:2), 범위 안이면 큰 피해(bz:1)
function detonate(x, y){
  explodeFx(x, y);
  if (!online) return;
  channel.send({type:'broadcast', event:'ex', payload:{x:+x.toFixed(1), y:+y.toFixed(1), i:myId}});
  for (const id in others){
    const o = others[id]; if (o.hp <= 0) continue;
    const d = Math.hypot(o.x - x, o.y - (o.lg >= 2 ? 18 : 40) - y);
    if (d > 165) continue;
    channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:o.x >= x ? 1 : -1, dmg:Math.round(Math.max(30, 80 * (1 - d / 175))), kb:520, st:.55, gm:3, m:0, a:myId, ar:0, bz:d < 85 ? 2 : 1, lc:.8}});
  }
}

/* ---------- 분쇄 / 절단 ---------- */
function gibBurst(x, y, dir, lg){
  if (gibs.length > 40) gibs.splice(0, gibs.length - 40);
  const g = (t, l, r, c) => gibs.push({t, l, r, c, x:x + (Math.random() - .5) * 14, y:y - 20 - Math.random() * 40, vx:(Math.random() - .5) * 640 + dir * 200, vy:-(220 + Math.random() * 640), rot:Math.random() * 6.3, vr:(Math.random() - .5) * 20, age:0, life:18});
  g('h', 0, 9);
  for (let i = 0; i < 8 - lg * 2; i++) g('l', 14 + Math.random() * 4, 0);     // 몸통·팔다리 조각
  for (let i = 0; i < 16; i++) g('c', 0, 2 + Math.random() * 4, Math.random() < .6 ? '#7a1010' : '#000');
  if (blood.length > 260) blood.splice(0, 160);
  for (let i = 0; i < 90; i++){
    const a = Math.random() * 6.3, sp = 100 + Math.random() * 700;
    blood.push({x:x + (Math.random() - .5) * 20, y:y - 20 - Math.random() * 40, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 260, r:1.5 + Math.random() * 3.5, t:0, life:1.4});
  }
  for (let i = 0; i < 12; i++) mists.push({x:x + (Math.random() - .5) * 30, y:y - 40 + (Math.random() - .5) * 50, vx:(Math.random() - .5) * 200, vy:-Math.random() * 120, r:8 + Math.random() * 10, t:0, max:.5 + Math.random() * .4});
  rings.push({x, y:y - 40, f:dir, t:0, s:.7});
  texts.push({x, y:y - 80, v:'SPLAT!', t:0, sz:22, c:'#ff5a5a'});
  const v = Math.max(0, 1 - Math.abs(x - me.x) / 900);
  sndGib(v); if (v > 0) shake = Math.max(shake, 14 * v);
}
function spawnLegGib(x, y, dir){
  if (gibs.length > 60) gibs.splice(0, 20);
  gibs.push({t:'l', l:18, r:0, x, y:y - 26, vx:dir * (160 + Math.random() * 200), vy:-(240 + Math.random() * 180), rot:Math.random() * 6, vr:(Math.random() - .5) * 16, age:0, life:16});
  bleed(x, y - 30, dir, .8, false);
  texts.push({x, y:y - 70, v:'CUT!', t:0, sz:16, c:'#ff7a4a'});
  sndChop(Math.max(0, 1 - Math.abs(x - me.x) / 900));
}
// 잘린 다리 단면에서 피가 떨어지고, 기어 다니면 바닥에 핏자국을 남김
function tickStumps(p, dt){
  if (!p.lg || p.hp <= 0) return;
  p.sd = (p.sd || 0) - dt; if (p.sd > 0) return;
  p.sd = .1 + Math.random() * .12;
  const cr = p.lg >= 2;
  if (blood.length < 340) blood.push({x:p.x - p.f * (cr ? 14 : 0) + (Math.random() - .5) * 6, y:p.y - (cr ? 8 : 34), vx:-p.f * (10 + Math.random() * 40), vy:-30, r:1.4 + Math.random() * 1.4, t:0, life:1.2});
  if (cr && p.moving && stains.length < 140) stains.push({x:p.x - p.f * 12, w:3 + Math.random() * 4, t:0, life:14});
}

/* ---------- 타격 이펙트 (스파크, 데미지 숫자, 사운드) ----------
   type 0 일반 타격 / 1 방패 막기 / 2 패링 / 3 가드 브레이크 */
function hitFx(x, y, type, pw, dmg, dir, ar, hy, ch){
  ch = ch || 56;
  const cy = y - ch, by = y - (ar && hy ? hy : ch);
  const vol = Math.max(0, 1 - Math.abs(x - me.x) / 900);
  const c = type === 1 ? '190,220,255' : type === 2 ? '255,235,120' : type === 3 ? '255,170,80' : '255,228,170';
  const n = type === 0 ? (ar ? 3 : 6 + Math.round(pw * 16)) : type === 2 ? 18 : type === 3 ? 20 : 8;
  const sgn = type === 0 ? dir : -dir;
  for (let i = 0; i < n; i++){
    const a = (Math.random() - .5) * 2.4, sp = 220 + Math.random() * (300 + pw * 450);
    sparks.push({x:x - dir * 4, y:cy + (Math.random() - .5) * 14, vx:Math.cos(a) * sp * sgn, vy:Math.sin(a) * sp - 50, t:0, life:.18 + Math.random() * .25, w:1 + Math.random() * 1.6, c});
  }
  bursts.push({x, y:cy, t:0, r:12 + pw * 34 + (type === 2 ? 16 : 0), c});
  if ((type === 0 || type === 3) && dmg > 0) bleed(x, by, dir, pw, !!ar);
  if (ar && type === 0) sndThunk(vol);
  if (type === 0 && pw > .5) rings.push({x, y:cy, f:dir, t:0, s:.3 + pw * .3});
  const label = type === 2 ? 'PARRY!' : type === 3 ? 'BREAK!' : type === 1 ? (dmg > 0 ? 'BLOCK ' + dmg : 'BLOCK') : String(dmg);
  texts.push({x:x + (Math.random() - .5) * 14, y:cy - 34, v:label, t:0, sz:type === 0 ? 14 + Math.round(dmg * .55) : 15, c:type === 0 ? '#ffe9b8' : type === 1 ? '#bcd8ff' : type === 2 ? '#ffe36a' : '#ffae55'});
  if (vol > 0){
    shake = Math.max(shake, (type === 0 ? 3 + pw * 12 : type === 1 ? 3 : 7) * vol);
    if (type === 2) ifl = Math.max(ifl, .12 * vol);
  }
  if (type === 0) sndHit(vol, pw); else if (type === 1) sndBlock(vol); else if (type === 2) sndParry(vol); else sndBreak(vol);
}

/* ---------- 피 이펙트 + 몸에 박히는 화살 ---------- */
function bleed(x, y, dir, pw, ar){
  if (blood.length > 320) blood.splice(0, 60);
  const n = 7 + Math.round(pw * 14) + (ar ? 8 : 0);
  for (let i = 0; i < n; i++){
    const a = (Math.random() - .5) * 2.0, sp = 120 + Math.random() * (260 + pw * 320), sg = Math.random() < .7 ? dir : -dir;
    blood.push({x:x + (Math.random() - .5) * 6, y:y + (Math.random() - .5) * 10, vx:Math.cos(a) * sp * sg, vy:Math.sin(a) * sp - 90 - Math.random() * 120, r:1.2 + Math.random() * 2.2, t:0, life:.9 + Math.random() * .7});
  }
  for (let i = 0; i < 4; i++) mists.push({x, y, vx:dir * (40 + Math.random() * 80), vy:-Math.random() * 40, r:4 + Math.random() * 5, t:0, max:.3 + Math.random() * .2});
}
function addArrow(p, dir, hy){
  if (p.arrows.length >= 6) p.arrows.shift();
  p.arrows.push({d:dir, ox:dir * 2, oy:Math.max(8, Math.min(p.lg >= 2 ? 28 : 88, hy || 50)), tilt:(Math.random() - .5) * .3, t:0, life:10, drip:.05});
}
function tickArrows(p, dt){
  for (let i = p.arrows.length - 1; i >= 0; i--){
    const a = p.arrows[i]; a.t += dt;
    if (a.t < 6){
      a.drip -= dt;
      if (a.drip <= 0){
        a.drip = .18 + Math.random() * .25;
        if (blood.length < 320) blood.push({x:p.x + a.ox, y:p.y - a.oy + 2, vx:(Math.random() - .5) * 20, vy:0, r:1.3 + Math.random(), t:0, life:1.2});
      }
    }
    if (a.t > a.life) p.arrows.splice(i, 1);
  }
}
function drawArrows(p){
  for (const a of p.arrows){
    const tx = p.x + a.ox, ty = p.y - a.oy, ex = tx - a.d * 22, ey = ty + a.tilt * 22;
    ctx.save(); ctx.globalAlpha *= Math.min(1, (a.life - a.t) / 1);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8a6f4a'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#d8d2c2'; ctx.lineWidth = 1.6;
    const fx = tx - a.d * 17, fy = ty + a.tilt * 17;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(ex - a.d * 2, ey - 3.5); ctx.moveTo(fx, fy); ctx.lineTo(ex - a.d * 2, ey + 3.5); ctx.stroke();
    ctx.fillStyle = 'rgba(160,18,18,.95)'; ctx.beginPath(); ctx.arc(tx - a.d * 2, ty, 2.6, 0, 7); ctx.fill();
    ctx.restore();
  }
}

// 공격한 쪽이 받는 피드백 (히트스톱, 진동, 패링당하면 휘청). 기관단총은 생략
function attackerFeedback(p){
  if (p.sm) return;
  slow = Math.max(slow, .03 + .08 * p.pw * (p.t === 2 ? .5 : 1));
  if (p.t === 2 && p.m){
    me.stun = Math.max(me.stun, .6); me.vx = -p.f * 340; me.vy = -170; me.pt = -1; me.sw = false; me.cd = Math.max(me.cd, .5);
    slow = Math.max(slow, .09);
  } else if (p.t === 1 && p.m){ me.vx = -p.f * 110; }
  if (navigator.vibrate){ try { navigator.vibrate(p.t === 0 ? 25 + Math.round(p.pw * 40) : 18); } catch(e){} }
}

// 내가 맞았을 때 (방패/패링/가드 브레이크/분쇄/절단 판정은 맞는 쪽에서)
function takeHit(p){
  let dmg = p.dmg || 0, kb = p.kb || 200, st = p.st || .1, type = 0;
  const bz = p.bz || 0, ch = me.lg >= 2 ? 24 : 56;
  const pw = Math.min(1, dmg / 26 * .6 + kb / 700 * .4);
  const front = !bz && me.g && me.f === -p.dir;      // 폭발은 방패로 못 막음
  if (front){
    if (me.gt < PARRY && me.pOk){
      type = 2; dmg = 0; kb = 0; st = 0; me.gg = Math.min(100, me.gg + 20); me.bf = .2; me.bt = 2;
    } else {
      me.gg -= dmg * (p.gm || 1) * 1.5;
      if (me.gg <= 0){
        type = 3; me.gg = 0; me.glock = true; me.g = false; dmg = Math.round(dmg * .4); kb = Math.max(kb, 300); st = .9; me.bf = .25; me.bt = 3;
      } else {
        type = 1; dmg = Math.max(1, Math.round(dmg * .1)); kb = kb * .3; st = .05; me.bf = .15; me.bt = 1;
      }
    }
  }
  me.hp = Math.max(0, me.hp - dmg);
  // 바주카: 직격(또는 폭발로 사망)하면 몸이 산산조각
  if (bz && (bz === 2 || me.hp <= 0)){
    me.hp = 0; me.gib = true; deadT = 2.6; me.g = false; me.pt = -1; me.rlOn = false; me.vx = me.vy = 0;
    gibBurst(me.x, me.y, p.dir, me.lg);
    slow = Math.max(slow, .12);
    if (navigator.vibrate){ try { navigator.vibrate([60, 30, 90]); } catch(e){} }
    if (online) channel.send({type:'broadcast', event:'ht', payload:{x:+me.x.toFixed(1), y:+me.y.toFixed(1), t:0, d:0, pw:1, f:p.dir, a:p.a, v:myId, m:0, gb:1, lg:me.lg}});
    sendState(true); return;
  }
  if (type !== 2){
    me.vx = p.dir * kb;
    if (kb > 450) me.vy = -380; else if (kb > 250) me.vy = -210;
    me.stun = Math.max(me.stun, st);
  }
  if (type === 0 || type === 3){
    me.flash = .15;
    if (st > .1){ me.pt = -1; me.sw = false; me.rlOn = false; me.cd = Math.min(me.cd, .35); }
  }
  // 다리 절단 (막지 못한 타격만)
  let lcut = 0;
  if (me.hp > 0 && me.lg < 2 && (type === 0 || type === 3) && Math.random() < (p.lc || 0)){
    lcut = 1; me.lg++; me.stun = Math.max(me.stun, .3);
    spawnLegGib(me.x, me.y, p.dir);
    if (me.lg >= 2){ me.pt = -1; me.sw = false; me.g = false; }
  }
  if (me.hp <= 0){ deadT = 1.8; me.g = false; }
  hitFx(me.x, me.y, type, pw, dmg, p.dir, p.ar, p.hy, ch);
  if (p.ar && (type === 0 || type === 3)) addArrow(me, p.dir, p.hy);
  if (!p.sm){
    slow = Math.max(slow, .03 + .07 * pw);
    if (navigator.vibrate){ try { navigator.vibrate(type === 0 ? 30 + Math.round(pw * 50) : 20); } catch(e){} }
  }
  if (online) channel.send({type:'broadcast', event:'ht', payload:{x:+me.x.toFixed(1), y:+me.y.toFixed(1), t:type, d:dmg, pw:+pw.toFixed(2), f:p.dir, a:p.a, v:myId, m:p.m ? 1 : 0, ar:p.ar ? 1 : 0, hy:p.hy, ch, lcut, sm:p.sm ? 1 : 0}});
  sendState(true);
}

/* ---------- 네트워크 (Supabase Realtime) ---------- */
let channel = null, online = false;
const configured = !SUPABASE_URL.includes("YOUR_PROJECT");
function connect(){
  if (!configured) return;
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {realtime:{params:{eventsPerSecond:60}}});
  channel = sb.channel('rain-arena', {config:{broadcast:{self:false}}});
  channel.on('broadcast', {event:'s'}, ({payload:p}) => {
    let o = others[p.i];
    if (!o){ o = others[p.i] = mk(p.x); o.ty = p.y; o.y = p.y; }
    if (o.hp <= 0 && p.h > 0) o.arrows = [];
    o.tx = p.x; o.ty = p.y; o.f = p.f; o.hp = p.h; o.w = p.w || 0; o.moving = p.m; o.g = !!p.g; o.n = String(p.n || '').slice(0, 10); o.seen = performance.now();
    o.lg = p.lg || 0; o.gib = !!p.gb;
    if (p.rl && !o.rlPrev){
      o.rlOn = true; o.rlt = 0;
      const rw = WEAPONS[o.w]; if (rw && rw.rl) reloadSfx(rw, Math.max(0, 1 - Math.abs(o.tx - me.x) / 900));
    }
    if (!p.rl) o.rlOn = false;
    o.rlPrev = !!p.rl;
    if (p.pu && !o.pu && o.pt < 0){ o.pt = 0; o.sw = false; } o.pu = p.pu;
  });
  channel.on('broadcast', {event:'hit'}, ({payload:p}) => {
    if (p.to !== myId || me.hp <= 0) return;
    takeHit(p);
  });
  channel.on('broadcast', {event:'ht'}, ({payload:p}) => {
    const o = others[p.v];
    if (p.gb){ if (o) o.gib = true; gibBurst(p.x, p.y, p.f, p.lg || 0); }
    else {
      hitFx(p.x, p.y, p.t, p.pw, p.d, p.f, p.ar, p.hy, p.ch);
      if (p.lcut) spawnLegGib(p.x, p.y, p.f);
      if (o){
        o.bf = .18; o.bt = p.t; if (p.t === 0 || p.t === 3) o.flash = .12;
        if (p.ar && (p.t === 0 || p.t === 3)) addArrow(o, p.f, p.hy);
      }
    }
    if (p.a === myId) attackerFeedback(p);
  });
  channel.on('broadcast', {event:'b'}, ({payload:p}) => {
    const w = WEAPONS[p.k]; if (!w) return;
    let o = others[p.i]; if (!o) o = others[p.i] = mk(p.x);
    o.w = p.k; o.f = p.f; o.rc = w.rk ? .2 : .12; spawnShot(p.x, p.y, p.f, p.k, false, p.sh, p.i);
    const v = Math.max(0, 1 - Math.abs(p.x - me.x) / 900);
    if (w.smg) sndSmg(v); else if (w.rk) sndBazooka(v); else twang(v);
  });
  channel.on('broadcast', {event:'ex'}, ({payload:p}) => {
    explodeFx(p.x, p.y);
    for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].rk && !bullets[i].own && bullets[i].sid === p.i) bullets.splice(i, 1);
  });
  channel.on('broadcast', {event:'fx'}, ({payload:p}) => { impactFx(p.x, p.f, !!p.g, p.s || 1); });
  channel.on('broadcast', {event:'bye'}, ({payload:p}) => { delete others[p.i]; });
  channel.subscribe(s => { online = (s === 'SUBSCRIBED'); if (online) sendState(true); });
  addEventListener('beforeunload', () => channel.send({type:'broadcast', event:'bye', payload:{i:myId}}));
}
// 상태가 바뀌었거나 400ms 지났을 때만 전송 (대기 중 메시지 수 절약)
let lastSig = '', lastSendT = 0;
function sendState(force){
  if (!online) return;
  const p = {i:myId, x:+me.x.toFixed(1), y:+me.y.toFixed(1), f:me.f, h:me.hp, w:me.w, m:me.moving, pu:me.pt >= 0, g:me.g ? 1 : 0, n:me.n, lg:me.lg, gb:me.gib ? 1 : 0, rl:me.rlOn ? 1 : 0};
  const sig = p.x + ',' + p.y + ',' + p.f + ',' + p.h + ',' + p.w + ',' + p.m + ',' + p.pu + ',' + p.g + ',' + p.lg + ',' + p.gb + ',' + p.rl, now = performance.now();
  if (!force && sig === lastSig && now - lastSendT < 400) return;
  lastSig = sig; lastSendT = now;
  channel.send({type:'broadcast', event:'s', payload:p});
}
setInterval(() => sendState(false), 66);

/* ---------- 근접 공격 판정 ---------- */
function doMelee(cw){
  for (const id in others){
    const o = others[id]; if (o.hp <= 0) continue;
    const dx = (o.x - me.x) * me.f, dy = Math.abs(o.y - me.y);
    if (dx > -8 && dx < cw.reach && dy < 64){
      let dmg = cw.dmg;
      if (cw.sp) dmg *= dx > 86 ? 1.4 : dx < 44 ? .6 : 1;   // 창은 끝부분이 가장 강함
      if (online) channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:me.f, dmg:Math.max(1, Math.round(dmg)), kb:cw.kb, st:cw.st, gm:cw.gm, m:1, a:myId, lc:cw.lc || 0}});
    }
  }
  if (cw.hm){
    const ix = me.x + me.f * 66, gnd = me.y > gy(ix) - 50;
    impactFx(ix, me.f, gnd, .55);
    if (online) channel.send({type:'broadcast', event:'fx', payload:{x:+ix.toFixed(1), f:me.f, g:gnd ? 1 : 0, s:.55}});
  }
}

/* ---------- 업데이트 ---------- */
function update(dt){
  const g0 = gy(me.x);
  const cw = WEAPONS[me.w];
  me.pcd = Math.max(0, me.pcd - dt);
  if (me.hp > 0){
    const stunned = me.stun > 0;
    me.stun = Math.max(0, me.stun - dt);
    // 방패: 누르는 동안 가드 (공격 중/기절 중엔 불가)
    const wantG = keys.S && !stunned && me.pt < 0 && !me.glock;
    if (wantG){
      if (!me.g){ me.g = true; me.gt = 0; me.pOk = me.pcd <= 0; me.pcd = .7; }
      else me.gt += dt;
    } else { me.g = false; me.gt = 0; }
    if (!me.g){
      me.gg = Math.min(100, me.gg + 26 * dt);
      if (me.glock && me.gg >= 35) me.glock = false;
    }
    const dir = stunned ? 0 : (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
    // 이동속도: 원거리 무기는 들고 쏘면서도 이동 가능, 다리가 잘리면 느려지고 둘 다 잘리면 기어 다님
    const lgm = me.lg >= 2 ? .26 : me.lg ? .72 : 1;
    const mvm = (me.pt >= 0 ? cw.mv : me.g ? .38 : cw.t === 'r' ? cw.mv : 1) * lgm;
    if (stunned) me.vx *= Math.max(0, 1 - dt * 5);
    else if (dir){
      if (me.pt < 0 && !me.g) me.f = dir;      // 휘두르는 중/가드 중엔 방향 고정
      me.vx += (dir * SPEED * mvm - me.vx) * Math.min(1, dt * 12);
    }
    else me.vx *= Math.max(0, 1 - dt * 10);
    if (wantJump && !stunned && me.lg < 2 && me.y >= g0 - 0.5){ me.vy = -JUMP * (me.lg ? .78 : 1); }
    // 장전 진행
    if (me.rlOn){
      me.rlt += dt;
      if (me.stun > .1 || !cw.rl) me.rlOn = false;
      else if (me.rlt >= cw.rl){ me.rlOn = false; me.ammo[me.w] = cw.max; sendState(true); }
    }
  } else {
    me.vx *= Math.max(0, 1 - dt * 6);
    me.rlOn = false;
    deadT -= dt;
    if (deadT <= 0){
      me.hp = 100; me.x = 300 + Math.random() * (WORLD - 600); me.y = 0; me.vx = me.vy = 0; me.pt = -1; me.stun = 0;
      me.g = false; me.gg = 100; me.glock = false; me.arrows = []; me.ammo = WEAPONS.map(w => w.max || 0);
      me.lg = 0; me.gib = false;
    }
  }
  me.vy += GRAV * dt; me.x += me.vx * dt; me.y += me.vy * dt;
  me.x = Math.max(20, Math.min(WORLD - 20, me.x));
  const g1 = gy(me.x);
  if (me.y > g1){ me.y = g1; me.vy = 0; }
  me.moving = me.y >= g1 - 1 && Math.abs(me.vx) > 20;
  if (me.moving) me.walk += dt * (me.lg >= 2 ? 6 : 11);
  me.flash = Math.max(0, me.flash - dt);
  me.bf = Math.max(0, me.bf - dt);
  tickArrows(me, dt); tickStumps(me, dt);

  // 무기: 공격 입력, 근접 판정, 화살/총알/로켓
  me.cd = Math.max(0, me.cd - dt); me.rc = Math.max(0, me.rc - dt);
  if (keys.A && started) attack();
  WEAPONS.forEach((g, i) => { if (g.t === 'r' && !g.rl && me.ammo[i] < g.max){ regen[i] = (regen[i] || 0) + dt; if (regen[i] > g.rg){ regen[i] = 0; me.ammo[i]++; } } });
  if (me.pt >= 0 && cw.t === 'm'){
    me.pt += dt;
    if (!me.sw && me.pt >= cw.dur * cw.w1){ me.sw = true; whoosh(1, cw.dmg / 26); }
    if (!me.hitDone && me.pt > cw.dur * (cw.w2 - .05)){ me.hitDone = true; doMelee(cw); }
    if (me.pt >= cw.dur) me.pt = -1;
  }
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i], px = b.x;
    b.vy += (b.g || 0) * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.rk) dust.push({x:b.x - b.f * 14, y:b.y, vx:-b.f * 20, vy:-10 - Math.random() * 20, r:3, t:0, max:.6});
    let dead = b.life <= 0 || b.y > gy(b.x);
    if (b.own && !dead && online){
      const lo = Math.min(px, b.x) - 14, hi = Math.max(px, b.x) + 14;
      for (const id in others){
        const o = others[id], top = o.lg >= 2 ? 30 : 90, hw = o.lg >= 2 ? 26 : 0;
        if (o.hp > 0 && o.x > lo - hw && o.x < hi + hw && b.y > o.y - top && b.y < o.y){
          dead = true;
          if (b.rk) break;                                   // 로켓은 아래에서 폭발 처리
          const wp = WEAPONS[b.k], hy = Math.round(Math.max(8, Math.min(top - 2, o.y - b.y)));
          const lc = hy < 36 ? (wp.lc || 0) : 0;
          if (b.smg) channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:b.f, dmg:b.dmg, kb:b.kb, st:b.st, gm:b.gm, m:0, a:myId, ar:0, sm:1, lc}});
          else {
            const dm = Math.abs(b.x - b.sx) < 140 ? .6 : 1;   // 너무 가까우면 위력 감소
            channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:b.f, dmg:Math.max(1, Math.round(b.dmg * dm)), kb:b.kb, st:b.st, gm:b.gm, m:0, a:myId, ar:1, hy, lc}});
          }
          break;
        }
      }
    }
    if (dead){ if (b.rk && b.own) detonate(b.x, b.y); bullets.splice(i, 1); }
  }
  for (let i = muz.length - 1; i >= 0; i--){ muz[i].t -= dt; if (muz[i].t <= 0) muz.splice(i, 1); }

  // 크레이터: 빠르게 파이고, 일정 시간 뒤 서서히 복구
  for (let i = craters.length - 1; i >= 0; i--){
    const c = craters[i]; c.age += dt;
    let k = Math.min(1, c.age / .1); k = 1 - (1 - k) * (1 - k);
    const rec = c.life - 8;
    if (c.age > rec) k *= Math.max(0, 1 - (c.age - rec) / 8);
    c.k = k;
    if (c.age > c.life) craters.splice(i, 1);
  }
  for (let i = debris.length - 1; i >= 0; i--){
    const d = debris[i]; d.t += dt;
    d.vy += GRAV * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    const g = gy(d.x);
    if (d.y > g){ d.y = g; d.vy = -d.vy * .35; d.vx *= .6; d.vr *= .6; if (Math.abs(d.vy) < 40){ d.vy = 0; d.vr = 0; d.vx = 0; } }
    if (d.t > d.life) debris.splice(i, 1);
  }
  // 분쇄된 살점/뼈: 튀다가 바닥에 굴러서 남음
  for (let i = gibs.length - 1; i >= 0; i--){
    const g = gibs[i]; g.age += dt;
    g.vy += GRAV * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.vr * dt;
    if (g.age < 2 && Math.random() < dt * 10 && blood.length < 340) blood.push({x:g.x, y:g.y, vx:g.vx * .2, vy:0, r:1.4 + Math.random() * 1.6, t:0, life:1});
    const gr = gy(g.x) - (g.r || 3);
    if (g.y > gr){ g.y = gr; g.vy = -g.vy * .3; g.vx *= .6; g.vr *= .5; if (Math.abs(g.vy) < 50){ g.vy = 0; g.vx = 0; g.vr = 0; } }
    if (g.age > g.life) gibs.splice(i, 1);
  }
  for (let i = fires.length - 1; i >= 0; i--){ fires[i].t += dt; if (fires[i].t > .5) fires.splice(i, 1); }
  for (let i = dust.length - 1; i >= 0; i--){
    const d = dust[i]; d.t += dt;
    d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= Math.max(0, 1 - dt * 2.2); d.vy *= Math.max(0, 1 - dt * 2); d.r += 40 * dt;
    if (d.t > d.max) dust.splice(i, 1);
  }
  for (let i = streaks.length - 1; i >= 0; i--){ const s = streaks[i]; s.t += dt; s.x += s.vx * dt; if (s.t > .3) streaks.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--){ rings[i].t += dt; if (rings[i].t > .45) rings.splice(i, 1); }
  // 타격 스파크, 번쩍임, 데미지 숫자
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i]; s.t += dt; s.vy += 900 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > s.life) sparks.splice(i, 1);
  }
  for (let i = bursts.length - 1; i >= 0; i--){ bursts[i].t += dt; if (bursts[i].t > .14) bursts.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--){ const t = texts[i]; t.t += dt; t.y -= 45 * dt; if (t.t > .75) texts.splice(i, 1); }
  // 피 방울: 중력으로 떨어지다 바닥에 닿으면 핏자국
  for (let i = blood.length - 1; i >= 0; i--){
    const b = blood[i]; b.t += dt; b.vy += 1100 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > gy(b.x)){
      if (stains.length < 140) stains.push({x:b.x, w:b.r * (2 + Math.random() * 3), t:0, life:14});
      blood.splice(i, 1); continue;
    }
    if (b.t > b.life) blood.splice(i, 1);
  }
  for (let i = mists.length - 1; i >= 0; i--){ const m = mists[i]; m.t += dt; m.x += m.vx * dt; m.y += m.vy * dt; m.r += 18 * dt; if (m.t > m.max) mists.splice(i, 1); }
  for (let i = stains.length - 1; i >= 0; i--){ stains[i].t += dt; if (stains[i].t > stains[i].life) stains.splice(i, 1); }

  // 다른 플레이어 보간
  const now = performance.now();
  for (const id in others){
    const o = others[id];
    if (now - o.seen > 4000){ delete others[id]; continue; }
    const px = o.x;
    o.x += (o.tx - o.x) * Math.min(1, dt * 14); o.y += (o.ty - o.y) * Math.min(1, dt * 14);
    if (o.moving || Math.abs(o.x - px) > 0.3) o.walk += dt * (o.lg >= 2 ? 6 : 11);
    o.rc = Math.max(0, o.rc - dt);
    if (o.rlOn){ o.rlt += dt; const rw = WEAPONS[o.w]; if (!rw || !rw.rl || o.rlt > rw.rl + .4) o.rlOn = false; }
    if (o.pt >= 0){
      const w = WEAPONS[o.w] || WEAPONS[1];
      if (!w.dur){ o.pt = -1; }
      else {
        o.pt += dt;
        if (!o.sw && o.pt >= w.dur * w.w1){ o.sw = true; whoosh(Math.max(0, 1 - Math.abs(o.x - me.x) / 900), w.dmg / 26); }
        if (o.pt >= w.dur) o.pt = -1;
      }
    }
    o.flash = Math.max(0, o.flash - dt); o.bf = Math.max(0, o.bf - dt);
    tickArrows(o, dt); tickStumps(o, dt);
  }
}

/* ---------- 그리기 ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (a, b, s) => [lerp(a[0], b[0], s), lerp(a[1], b[1], s)];
function limb(x, y, a1, l1, a2, l2, f){
  const jx = x + Math.sin(a1) * l1 * f, jy = y + Math.cos(a1) * l1;
  const ex = jx + Math.sin(a2) * l2 * f, ey = jy + Math.cos(a2) * l2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(jx, jy); ctx.lineTo(ex, ey); ctx.stroke();
  return [ex, ey];
}
function limbPos(x, y, a1, l1, a2, l2, f){
  return [x + (Math.sin(a1) * l1 + Math.sin(a2) * l2) * f, y + Math.cos(a1) * l1 + Math.cos(a2) * l2];
}
// 어깨에서 목표점까지 팔 뻗기 (팔꿈치 자동 계산)
function armTo(sx, sy, tx, ty, f, up){
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 1;
  if (d > 29){ dx *= 29 / d; dy *= 29 / d; d = 29; }
  const th = Math.atan2(dy, dx), a = Math.acos(d / 30) * (up ? -f : f);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 15 * Math.cos(th + a), sy + 15 * Math.sin(th + a)); ctx.lineTo(sx + dx, sy + dy); ctx.stroke();
  return [sx + dx, sy + dy];
}
// 무기 각도: 대기 -> 뒤로 젖힘 -> 앞으로 휘두름 -> 복귀
function swingAngle(wp, t){
  if (wp.sp){
    if (t < 0) return 1.35;
    return t < wp.w1 ? lerp(1.35, 1.9, t / wp.w1) : t < wp.w2 ? lerp(1.9, 1.5, (t - wp.w1) / (wp.w2 - wp.w1)) : lerp(1.5, 1.35, (t - wp.w2) / (1 - wp.w2));
  }
  const idle = 2.6, up = wp.hm ? 4.1 : wp.ax ? 3.9 : 3.7;
  if (t < 0) return idle;
  if (t < wp.w1) return lerp(idle, up, t / wp.w1);
  if (t < wp.w2) return lerp(up, 1.4, (t - wp.w1) / (wp.w2 - wp.w1));
  return lerp(1.4, idle, (t - wp.w2) / (1 - wp.w2));
}
function swingTrail(wp, fx, fy, f, ba){
  const up = wp.hm ? 4.1 : wp.ax ? 3.9 : 3.7, r = wp.len * .95;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 2 + wp.dmg / 9;
  let px = fx + Math.sin(ba) * f * r, py = fy + Math.cos(ba) * r;
  for (let k = 1; k <= 7; k++){
    const b = Math.min(up, ba + k * .16);
    const qx = fx + Math.sin(b) * f * r, qy = fy + Math.cos(b) * r;
    ctx.strokeStyle = 'rgba(235,240,255,' + (.42 * (1 - k / 8)) + ')';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();
    px = qx; py = qy;
  }
  ctx.restore();
}
function drawWeapon(wp, fx, fy, f, ba){
  const sx = Math.sin(ba) * f, sy = Math.cos(ba), px = -sy, py = sx, L = wp.len;
  const tx = fx + sx * L, ty = fy + sy * L;
  ctx.lineCap = 'round';
  if (wp.sp){
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx - sx * 14, fy - sy * 14); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx + sx * 13, ty + sy * 13); ctx.lineTo(tx + px * 4.5, ty + py * 4.5); ctx.lineTo(tx - px * 4.5, ty - py * 4.5); ctx.closePath(); ctx.fill();
  } else if (wp.hm){
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(tx + px * 9, ty + py * 9); ctx.lineTo(tx - px * 9, ty - py * 9); ctx.stroke();
  } else if (wp.ax){
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
    const ax = fx + sx * (L - 16), ay = fy + sy * (L - 16);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + px * 16, ay + py * 16); ctx.lineTo(tx + px * 12, ty + py * 12); ctx.lineTo(tx, ty); ctx.closePath(); ctx.fill();
  } else {
    ctx.lineWidth = wp.dmg > 10 ? 5 : 4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(fx + sx * 4 + px * 6, fy + sy * 4 + py * 6); ctx.lineTo(fx + sx * 4 - px * 6, fy + sy * 4 - py * 6); ctx.stroke();
  }
}
function drawShield(cx, cy, f, bf, bt){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(f, 1);
  ctx.fillStyle = bf > 0 ? (bt === 2 ? '#ffe27a' : bt === 3 ? '#ff9a55' : '#cfe6ff') : '#4b5058';
  ctx.strokeStyle = bf > 0 ? '#ffffff' : '#9aa3ad'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(4, 0, 8, 25, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = bf > 0 ? '#ffffff' : '#9aa3ad'; ctx.beginPath(); ctx.arc(8, 0, 3.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBow(fx, fy, f, rc){
  ctx.save(); ctx.translate(fx, fy); ctx.scale(f, 1);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-14, 0, 16, -1.2, 1.2); ctx.stroke();
  const tipx = -14 + 16 * Math.cos(1.2), tipy = 16 * Math.sin(1.2), pull = rc > 0 ? 0 : 5;
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.beginPath(); ctx.moveTo(tipx, -tipy); ctx.lineTo(tipx - pull, 0); ctx.lineTo(tipx, tipy); ctx.stroke();
  ctx.restore();
}
/* --- 기관단총: 장전 모션 (u: 0~1) 탄창 분리 → 허리춤에서 새 탄창 → 삽입 → 장전손잡이 당김 --- */
function smgHand(u, gx, gyy, f, belt){
  const grip = [gx + f * 15, gyy + 4], well = [gx + f * 9, gyy + 12];
  if (u < 0) return {h:grip};
  let h;
  if (u < .12) h = mix(grip, well, u / .12);
  else if (u < .42) h = mix(well, belt, (u - .12) / .3);
  else if (u < .5) h = belt;
  else if (u < .78) h = mix(belt, well, (u - .5) / .28);
  else {
    const r = [gx - f * 2, gyy - 10], v = (u - .78) / .22;
    h = v < .2 ? mix(well, r, v / .2) : v < .55 ? [r[0] - f * 9 * Math.sin(Math.PI * (v - .2) / .35), r[1]] : mix(r, grip, (v - .55) / .45);
  }
  const s = (u - .12) / .28;
  return {h, hold:u >= .45 && u < .78, fall:u >= .12 && u < .4 ? [gx + f * 9, gyy + 12 + 90 * s * s, s * 3 * f, 1 - s * .7] : null};
}
function drawSMG(fx, fy, f, u, rc){
  const tilt = u < 0 ? 0 : u < .12 ? .5 * u / .12 : u < .8 ? .5 : .5 * (1 - (u - .8) / .2);
  ctx.save(); ctx.translate(fx - f * (rc > 0 ? 3 : 0), fy); ctx.scale(f, 1); ctx.rotate(tilt);
  ctx.fillRect(-9, -5, 30, 7); ctx.fillRect(-16, -3, 8, 4); ctx.fillRect(2, -8, 6, 3);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(21, -2.5); ctx.lineTo(34, -2.5); ctx.stroke();
  if (u < .12 || u >= .78) ctx.fillRect(7, 2, 5, 15);   // 탄창
  ctx.restore();
}
/* --- 바주카: 포신을 숙이고 → 등 뒤에서 로켓을 꺼내 → 뒤쪽으로 밀어 넣고 → 다시 어깨에 거치 --- */
const bzT = u => u < 0 ? 0 : u < .15 ? .6 * u / .15 : u < .85 ? .6 : .6 * (1 - (u - .85) / .15);
function bzHand(u, sx, sy, f){
  const t = bzT(u), grip = [sx + f * 10, sy + 1];
  if (u < 0) return {h:grip, t};
  const ax = [f * Math.cos(t), Math.sin(t)], rr = [sx - f * 26 * Math.cos(t), sy - 7 - 26 * Math.sin(t)];
  const st = [rr[0] - ax[0] * 24, rr[1] - ax[1] * 24], pick = [sx - f * 15, sy - 30];
  let h;
  if (u < .15) h = grip;
  else if (u < .4) h = mix(grip, pick, (u - .15) / .25);
  else if (u < .75) h = mix(pick, st, (u - .4) / .35);
  else if (u < .85) h = mix(st, rr, (u - .75) / .1);
  else h = mix(rr, grip, (u - .85) / .15);
  return {h, t, ax, hold:u >= .38 && u < .85};
}
function drawBazooka(sx, sy, f, t, rc, loaded){
  ctx.save(); ctx.translate(sx, sy - 7); ctx.scale(f, 1); ctx.rotate(t);
  ctx.lineCap = 'butt'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(40, 0); ctx.stroke();
  ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-29, 0); ctx.lineTo(-22, 0); ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(10, 11); ctx.stroke();
  ctx.fillRect(18, -8, 5, 3);
  if (loaded){ ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.moveTo(40, -3.5); ctx.lineTo(50, 0); ctx.lineTo(40, 3.5); ctx.fill(); }
  if (rc > 0){ ctx.fillStyle = 'rgba(255,170,60,.9)'; ctx.beginPath(); ctx.arc(-36, 0, 8 * rc / .2 + 3, 0, 7); ctx.fill(); }
  ctx.restore();
}
function drawRocket(hx, hy, ax){
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#2a2d32'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + ax[0] * 20, hy + ax[1] * 20); ctx.stroke();
  ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.arc(hx + ax[0] * 22, hy + ax[1] * 22, 3.2, 0, 7); ctx.fill(); ctx.restore();
}

function person(p, label){
  const lg = p.lg || 0, crawl = p.hp > 0 && lg >= 2;
  const air = !crawl && p.y < gy(p.x) - 2, mv = p.moving ? 1 : 0, f = p.f;
  const x = p.x, hipY = p.y - 36, shY = p.y - 64, col = p.flash > 0 ? '#ffffff' : '#000';
  ctx.save();
  if (p.hp <= 0){ ctx.translate(x, p.y); ctx.rotate(-Math.PI / 2 * f); ctx.translate(-x, -p.y); ctx.globalAlpha = .7; }
  ctx.strokeStyle = ctx.fillStyle = col;
  ctx.lineWidth = 6; ctx.lineCap = ctx.lineJoin = 'round';
  // 잘린 다리 단면
  const stump = (ax, ay, ex, ey) => {
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = '#a01818'; ctx.beginPath(); ctx.arc(ex, ey, 3.3, 0, 7); ctx.fill(); ctx.fillStyle = col;
  };
  let sx0, sy0;   // 어깨 위치
  if (crawl){
    // 두 다리가 잘려 엎드려 기어 다니는 자세
    const hx = x - f * 13, hy = p.y - 8; sx0 = x + f * 13; sy0 = p.y - 12;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(sx0, sy0); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx0 + f * 14, sy0 - 3, 9, 0, 7); ctx.fill();
    stump(hx, hy, hx - f * 7, hy + 1); stump(hx, hy, hx - f * 6, hy - 3);
  } else {
    for (let i = 0; i < 2; i++){
      const ph = p.walk + i * Math.PI;
      const th = air ? (i ? 0.6 : -0.3) : Math.sin(ph) * 0.8 * mv;
      if (i < lg){ stump(x, hipY, x + Math.sin(th) * 6 * f, hipY + Math.cos(th) * 6 + 3); continue; }
      const kn = air ? 0.7 : Math.max(0, Math.cos(ph)) * 1.0 * mv;
      limb(x, hipY, th, 18, th - kn, 18, f);
    }
    ctx.beginPath(); ctx.moveTo(x, hipY); ctx.lineTo(x, shY); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, shY - 11, 9, 0, 7); ctx.fill();
    sx0 = x; sy0 = shY + 2;
  }
  const wp = WEAPONS[p.w] || WEAPONS[1], ranged = wp.t === 'r', guard = !!p.g, melee = p.pt >= 0 && !ranged;
  const ru = p.rlOn && wp.rl ? Math.min(1, p.rlt / wp.rl) : -1, ph = p.walk;
  const cArm = i => armTo(sx0, sy0, sx0 + f * (16 + Math.sin(ph + i * Math.PI) * 11), p.y - 3 - Math.max(0, Math.cos(ph + i * Math.PI)) * 6, f, true);
  // 앞쪽 팔 자세
  let fa = 0, fe = 0, t = -1;
  if (guard){ fa = fe = 1.3; }
  else if (melee){
    t = p.pt / wp.dur; const w1 = wp.w1, w2 = wp.w2;
    if (t < w1){ const s = t / w1; fa = lerp(.14, -.6, s); fe = fa + lerp(0, 1.6, s); }
    else if (t < w2){ const s = (t - w1) / (w2 - w1); fa = lerp(-.6, 1.55, s); fe = fa + lerp(1.6, 0, s); }
    else { const s = (t - w2) / (1 - w2); fa = lerp(1.55, .14, s); fe = fa; }
  } else if (ranged){ fa = fe = wp.smg ? 1.45 : wp.rk ? 1.4 : 1.5 - 0.3 * (p.rc || 0) / .12; }
  else if (air){ fa = .85; fe = fa; }
  else { fa = .14 + Math.sin(ph) * 0.7 * mv; fe = fa + 0.5 * mv; }
  const cFront = crawl && !guard && !melee && !ranged;
  const fh = cFront ? null : limbPos(sx0, sy0, fa, 15, fe, 15, f);
  // 뒤쪽 팔 (총/바주카는 두 손으로 받쳐 듦 + 장전 모션)
  const gun = ranged && !guard && (wp.smg || wp.rk);
  let gs = null;
  if (gun){
    gs = wp.smg ? smgHand(ru, fh[0], fh[1], f, crawl ? [x - f * 10, p.y - 8] : [x + f * 3, p.y - 40]) : bzHand(ru, sx0, sy0, f);
    armTo(sx0, sy0, gs.h[0], gs.h[1], f, crawl);
    ctx.beginPath(); ctx.arc(gs.h[0], gs.h[1], 3.5, 0, 7); ctx.fill();
  } else if (crawl) cArm(1);
  else { const a = air ? -0.75 : -0.14 + Math.sin(ph + Math.PI) * 0.7 * mv; limb(sx0, sy0, a, 15, a + 0.5 * mv, 15, f); }
  // 앞쪽 팔

  ctx.beginPath(); ctx.arc(fx, fy, 4.5, 0, 7); ctx.fill();

    if (gs.fall){ const q = gs.fall; ctx.save(); ctx.translate(q[0], q[1]); ctx.rotate(q[2]); ctx.globalAlpha *= q[3]; ctx.fillRect(-2.5, -7, 5, 15); ctx.restore(); }
  } else if (gun){
    drawBazooka(sx0, sy0, f, gs.t, p.rc || 0, ru < 0 ? (p === me ? me.ammo[me.w] >= 1 : true) : ru >= .85);
    if (gs.hold) drawRocket(gs.h[0], gs.h[1], gs.ax);

  else {
    const ba = swingAngle(wp, t);
    if (t >= 0 && !wp.sp && t >= wp.w1 && t < wp.w2 + .04) swingTrail(wp, fx, fy, f, ba);

  ctx.restore();
  // 체력바 + 닉네임
  if (p.hp > 0){
    const top = crawl ? 40 : 100;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x - 18, p.y - top, 36, 4);
    ctx.fillStyle = '#b33'; ctx.fillRect(x - 18, p.y - top, 36 * p.hp / 100, 4);
    if (label){ ctx.fillStyle = '#9aa0a8'; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, x, p.y - top - 6); }
  }
}

// 비 (망치 풍압에 휩쓸림)
const drops = Array.from({length: 230}, () => ({x:Math.random(), y:Math.random(), l:10 + Math.random() * 16, s:0.9 + Math.random() * 0.8}));
function rain(dt){
  rainWind *= Math.exp(-dt * 2.5);
  if (Math.abs(rainWind) < .01) rainWind = 0;
  const slant = 0.15 - rainWind * 0.35;
  ctx.strokeStyle = 'rgba(170,182,200,.32)'; ctx.lineWidth = 1.2; ctx.lineCap = 'butt';
  ctx.beginPath();
  for (const d of drops){
    d.y += dt * d.s * 1.1; d.x += dt * d.s * (rainWind - 0.12);
    if (d.y > 1){ d.y = -0.05; d.x = Math.random() * 1.2; }
    if (d.x < -0.1) d.x = 1.1;
    if (d.x > 1.2) d.x = -0.1;
    const sx = d.x * W, sy = d.y * H;
    ctx.moveTo(sx, sy); ctx.lineTo(sx - d.l * slant, sy + d.l);
  }
  ctx.stroke();
}

/* ---------- 사운드 ---------- */
let ac = null;
function initAudio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ac && ac.state === 'suspended') ac.resume();
}
['pointerdown','keydown'].forEach(e => addEventListener(e, initAudio));
function nz(dur, freq, type, vol, pow){
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, pow || 2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
function tn(f1, f2, dur, vol, type){
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
function sndHit(v, pw){
  if (!ac || v <= 0) return;
  tn(170, 48, .16 + pw * .1, (.45 + pw * .6) * v, 'sine');
  nz(.09 + pw * .08, 1800, 'lowpass', (.5 + pw * .4) * v, 3);
}
function sndThunk(v){
  if (!ac || v <= 0) return;
  tn(320, 110, .09, .35 * v, 'triangle'); nz(.04, 1200, 'lowpass', .3 * v, 2);
}
function sndBlock(v){
  if (!ac || v <= 0) return;
  tn(1250, 1180, .22, .22 * v, 'square'); tn(1870, 1800, .16, .14 * v, 'triangle'); nz(.05, 3500, 'highpass', .4 * v, 2);
}
function sndParry(v){
  if (!ac || v <= 0) return;
  tn(1900, 1800, .5, .3 * v, 'triangle'); tn(2850, 2800, .35, .18 * v, 'sine'); nz(.07, 4500, 'highpass', .5 * v, 2); tn(90, 60, .15, .5 * v, 'sine');
}
function sndBreak(v){
  if (!ac || v <= 0) return;
  nz(.45, 700, 'lowpass', .9 * v, 2); tn(220, 50, .4, .5 * v, 'sawtooth'); sndBlock(v);
}
function whoosh(v, pw){
  if (!ac || v <= 0) return;
  const t = ac.currentTime, dur = .16 + pw * .12, len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(1800, t + dur);
  const g = ac.createGain(); g.gain.value = .22 * v * (.7 + pw * .6);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
}
function twang(v){
  if (!ac || v <= 0) return;
  tn(220, 140, .12, .25 * v, 'triangle'); nz(.05, 2500, 'bandpass', .2 * v, 2);
}
function sndSmg(v){
  if (!ac || v <= 0) return;
  tn(210, 80, .06, .22 * v, 'square'); nz(.05, 2800, 'bandpass', .25 * v, 2);
}
function sndBazooka(v){
  if (!ac || v <= 0) return;
  nz(.5, 600, 'lowpass', .7 * v, 1.5); tn(140, 40, .35, .55 * v, 'sawtooth');
}
function sndExplode(v){
  if (!ac || v <= 0) return;
  nz(.9, 500, 'lowpass', 1.1 * v, 1.5); tn(90, 28, .7, .9 * v, 'sine');
}
function sndGib(v){
  if (!ac || v <= 0) return;
  nz(.35, 900, 'lowpass', .9 * v, 2); tn(120, 40, .3, .6 * v, 'sine'); nz(.15, 300, 'bandpass', .6 * v, 1);
}
function sndChop(v){
  if (!ac || v <= 0) return;
  nz(.08, 1500, 'highpass', .4 * v, 2); tn(200, 80, .1, .4 * v, 'sawtooth');
}
function thunder(){
  if (!ac) return;
  const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){ const k = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 2.2) * (1 + Math.sin(k * 40) * .3); }
  const src = ac.createBufferSource(); src.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160;
  const g = ac.createGain(); g.gain.value = 1.6;
  src.connect(lp); lp.connect(g); g.connect(ac.destination); src.start();
}
// 망치 충격음: 저음 쿵 + 파편 노이즈
function boom(v){
  if (!ac || v <= 0) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(35, t + .35);
  g.gain.setValueAtTime(.9 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .45);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .5);
  const len = Math.floor(ac.sampleRate * .25), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = ac.createBufferSource(); s.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const g2 = ac.createGain(); g2.gain.value = .5 * v;
  s.connect(lp); lp.connect(g2); g2.connect(ac.destination); s.start(t);
}

/* ---------- 번개 ---------- */
let clock = 0, nextBolt = 3, flash = 0, flick = 0, bolt = null, boltT = 0, thunderAt = 0;
function lightningTick(dt){
  clock += dt;
  if (clock > nextBolt){
    flash = 1; flick = clock + 0.1 + Math.random() * 0.1; boltT = 0.3;
    const bx = Math.random() * W; bolt = [[bx, 0]];
    let x = bx, y = 0;
    while (y < H * 0.68){ y += 20 + Math.random() * 40; x += (Math.random() - .5) * 60; bolt.push([x, y]); }
    nextBolt = clock + 6 + Math.random() * 10;
    thunderAt = clock + 0.3 + Math.random() * 1.6;
  }
  if (flick && clock > flick){ flash = 0.8; flick = 0; boltT = 0.2; }
  if (thunderAt && clock > thunderAt){ thunderAt = 0; thunder(); }
  flash = Math.max(0, flash - dt * 2.8); boltT = Math.max(0, boltT - dt);
}

const splashes = []; let splashAcc = 0;
let last = performance.now(), camX = me.x;
function frame(t){
  const rdt = Math.min(0.05, (t - last) / 1000); last = t;
  const dt = slow > 0 ? rdt * 0.1 : rdt;   // 히트스톱 (타격 순간 거의 멈춤)
  slow = Math.max(0, slow - rdt);
  update(dt); lightningTick(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#121417'); gr.addColorStop(0.68, '#44474c'); gr.addColorStop(1, '#101113');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  if (flash > 0){ ctx.fillStyle = 'rgba(215,225,245,' + (flash * 0.6) + ')'; ctx.fillRect(0, 0, W, H); }
  if (boltT > 0 && bolt){
    ctx.save(); ctx.strokeStyle = 'rgba(240,245,255,' + Math.min(1, boltT * 4) + ')'; ctx.lineWidth = 3;
    ctx.shadowColor = '#cfe0ff'; ctx.shadowBlur = 18; ctx.beginPath();
    bolt.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore();
  }
  // 카메라: 내 캐릭터 따라가기 + 화면 흔들림
  const viewW = W / scale;
  const target = Math.max(0, Math.min(WORLD - viewW, me.x - viewW / 2));
  camX += (target - camX) * Math.min(1, rdt * 8);
  shake *= Math.exp(-rdt * 7); if (shake < .3) shake = 0;
  const shx = (Math.random() - .5) * 2 * shake, shy = (Math.random() - .5) * 2 * shake;
  const groundScreen = H * 0.68;
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, (-camX * scale + shx) * DPR, (groundScreen + shy) * DPR);

  // 바닥 (검정, 크레이터 반영)
  const gx0 = camX - 60, gx1 = camX + viewW + 60;
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(gx0, 3000);
  for (let x = gx0; x <= gx1; x += 6) ctx.lineTo(x, gy(x));
  ctx.lineTo(gx1, gy(gx1)); ctx.lineTo(gx1, 3000); ctx.closePath(); ctx.fill();
  // 크레이터: 고인 물, 윤곽선, 균열
  for (const c of craters){

    const k = c.k; if (k < .02) continue;
    const lvl = c.d * k * .5;
    ctx.fillStyle = 'rgba(150,170,200,' + (.22 * k) + ')';
    for (let x = c.x - c.r; x < c.x + c.r; x += 4){ const y = gy(x); if (y > lvl) ctx.fillRect(x, lvl, 4.5, y - lvl); }
    ctx.strokeStyle = 'rgba(125,132,145,' + (.45 * k) + ')'; ctx.lineWidth = 1.2; ctx.lineCap = 'round'; ctx.beginPath();
    let first = true;
    for (let x = c.x - c.r * 1.45; x <= c.x + c.r * 1.45; x += 4){ const y = gy(x); if (first){ ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(100,106,118,' + (.55 * k) + ')'; ctx.beginPath();
    for (const cr of c.cracks){
      let x = c.x + cr.x, y = gy(x) + 1; ctx.moveTo(x, y);

    ctx.stroke();
  }

  splashAcc += dt * 60; let sn = Math.floor(splashAcc); splashAcc -= sn;
  while (sn-- > 0 && splashes.length < 160) splashes.push({x:camX + Math.random() * viewW, t:0, s:.6 + Math.random() * .8});
  ctx.lineWidth = 1;

    if (k >= 1){ splashes.splice(i, 1); continue; }

    ctx.strokeStyle = 'rgba(190,205,225,' + (0.55 * (1 - k)) + ')';
    ctx.beginPath(); ctx.ellipse(sp.x, sy0, (2 + k * 9) * sp.s, (1 + k * 2.5) * sp.s, 0, 0, 7); ctx.stroke();
    const h = Math.sin(k * Math.PI) * 9 * sp.s;

    ctx.beginPath(); ctx.moveTo(-d.s, -d.s * .5); ctx.lineTo(d.s * .8, -d.s * .7); ctx.lineTo(d.s * .4, d.s * .6); ctx.lineTo(-d.s * .7, d.s * .4); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // 분쇄된 신체 조각

  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const tx of texts){
    const a = Math.min(1, (.75 - tx.t) / .25), pop = tx.t < .08 ? 1 + (1 - tx.t / .08) * .5 : 1;
    ctx.globalAlpha = a; ctx.font = 'bold ' + Math.round(tx.sz * pop) + 'px system-ui';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(tx.v, tx.x, tx.y);
    ctx.fillStyle = tx.c; ctx.fillText(tx.v, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;

  // 비 (화면 좌표)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  rain(rdt);
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.25, W / 2, H * 0.55, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (ifl > .01){ ctx.fillStyle = 'rgba(255,255,255,' + ifl + ')'; ctx.fillRect(0, 0, W, H); }
  ifl = Math.max(0, ifl - rdt * 2);

  hpEl.style.width = me.hp + '%';
  ggEl.style.width = me.gg + '%'; ggEl.style.background = me.glock ? '#b7793a' : '#5a8fc7';
  { const wp = WEAPONS[me.w]; wlEl.textContent = wp.ic + ' ' + wp.n + (wp.t === 'r' ? '  ' + (me.rlOn ? '장전 중…' : me.ammo[me.w] + '/' + wp.max) : '') + (me.lg >= 2 ? ' · 기어가는 중' : me.lg ? ' · 다리 부상' : ''); }
  msgEl.textContent = !started ? '' : !configured ? '🔴 오프라인\n(Supabase 키 미설정)' : online ? '🟢 ' + (Object.keys(others).length + 1) + '명 접속' : '🟠 연결 중…';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
