/* ---------- 활 차징: 누르고 있으면 시위를 당기고, 떼면 발사 (차징할수록 강하고 빠르고 멀리) ---------- */
function bowTick(dt){
  const wp = WEAPONS[me.w];
  if (!wp.chg || me.tk >= 0 || me.ad || me.hp <= 0 || me.stun > 0 || me.g || me.rlOn || me.pt >= 0){ me.bc = 0; me.cv = 0; return; }
  const wasCharging = me.bc > 0;
  if (keys.A && started){
    if (me.cd <= 0 && me.ammo[me.w] >= 1){
      const was = me.bc;
      if (was === 0) me.aim = BOW_MIN;   // 차징 시작할 때 맨 아래(거의 수평)에서 시작
      me.bc = Math.min(wp.chg, me.bc + dt);
      if (was < wp.chg && me.bc >= wp.chg) click(1, 2);   // 풀 차징 딸깍
    }
  } else if (me.bc > 0){
    fireBow(Math.max(0, Math.min(1, me.bc / wp.chg)));
  }
  // 점프 버튼을 누르고 있으면 조준이 위로, 가만히 두면 천천히 아래로 내려감
  if (me.bc > 0) me.aim = Math.max(BOW_MIN, Math.min(1.25, me.aim + (keys.U ? 1.2 : -.7) * dt));

  me.cv = me.bc / wp.chg;

function fireBow(pw){

// 활 초기 속도: 속도는 차징 비율에 비례(약하게 당기면 느려서 금방 떨어짐), 방향은 조준각. 거리는 중력 때문에 속도²에 비례해서 나옴

  if (!started || me.hp <= 0 || me.emcd > 0 || !EMOTES[i]) return;
  me.em = EMOTES[i]; me.emt = EMT; me.emcd = .8;
  emoteSfx(1);
  if (online) channel.send({type:'broadcast', event:'em', payload:{i:myId, e:i}});
}
function emoteSfx(v){ if (ac && v > 0) tn(520, 980, .09, .16 * v, 'sine'); }
function drawEmote(p){
  if (p.emt <= 0 || p.hp <= 0) return;
  const age = EMT - p.emt, a = Math.min(1, p.emt / .4);
  const top = p.ad ? 168 : p.tk >= 0 ? 138 : (p.lg >= 2 || p.ps === 2) ? 40 : p.ps === 1 ? 74 : 100;
  const pop = age < .18 ? .4 + 1.0 * (age / .18) : age < .3 ? 1.4 - .4 * ((age - .18) / .12) : 1;   // 톡 튀어나오는 느낌
  const x = p.x, y = p.y - top - 34 - Math.min(age, 1) * 10 + Math.sin(age * 5) * 1.5;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(pop, pop);
  ctx.fillStyle = 'rgba(235,240,248,.92)'; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 17, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5, 14); ctx.lineTo(0, 24); ctx.lineTo(5, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(235,240,248,.95)'; ctx.fillRect(-4, 13, 8, 3);
  ctx.font = '22px system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.em, 0, 1);
  ctx.restore();
}

/* ---------- 충격 이펙트 (망치 내려치기 / 폭발) ---------- */
function impactFx(x, f, ground, s){
  s = s || 1;
  const gh = gy(x);
  rings.push({x, y:gh - 56, f, t:0, s});
  const ns = Math.ceil(14 * s);
  for (let i = 0; i < ns; i++) streaks.push({x:x + f * Math.random() * 18, y:gh - 8 - Math.random() * 100 * s, vx:f * (700 + Math.random() * 600) * s, len:(30 + Math.random() * 60) * s, t:0});
  for (let i = 0; i < Math.ceil(12 * s); i++) dust.push({x:x + (Math.random() - .5) * 40, y:gh - 4, vx:f * (80 + Math.random() * 280) * s + (Math.random() - .5) * 60, vy:-Math.random() * 70, r:(5 + Math.random() * 6) * s, t:0, max:.5 + Math.random() * .5});
  if (ground){
    const r = (120 + Math.random() * 30) * s, cracks = [];
    for (let i = 0; i < 14; i++){
      const side = i % 2 ? 1 : -1, pts = [], n = 3 + Math.floor(Math.random() * 3);
      for (let j = 0; j < n; j++) pts.push([side * (Math.random() * 18 - 3), 5 + Math.random() * 10]);
      cracks.push({x:side * r * (.3 + Math.random() * 1.1), p:pts});
    }
    if (craters.length >= 60) craters.shift();
    craters.push({x, r, d:(46 + Math.random() * 10) * s, age:0, life:26, k:0, cracks});
    for (let i = 0; i < Math.ceil(40 * s); i++) debris.push({x:x + (Math.random() - .5) * 50, y:gh - 2, vx:(Math.random() - .5) * 320 + f * 160, vy:-(260 + Math.random() * 520) * s, s:2.5 + Math.random() * 5, rot:Math.random() * 6, vr:(Math.random() - .5) * 14, t:0, life:1.4 + Math.random() * .8});
  }
  const near = Math.max(0, 1 - Math.abs(x - me.x) / 900);
  if (near > 0){
    shake = Math.max(shake, 20 * near * s);
    ifl = Math.max(ifl, .2 * near * s);
    rainWind = f * 2.2 * near * s;
    boom(near * s);
    if (near > .5 && navigator.vibrate){ try { navigator.vibrate(45); } catch(e){} }
  }
}

/* ---------- 로켓 폭발 ---------- */
function explodeFx(x, y){
  const g = gy(x);
  fires.push({x, y:Math.min(y, g - 6), t:0, r:115});
  for (let i = 0; i < 34; i++){
    const a = Math.random() * 6.3, sp = 200 + Math.random() * 700;
    sparks.push({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 120, t:0, life:.3 + Math.random() * .5, w:1.4 + Math.random() * 2, c:Math.random() < .5 ? '255,170,60' : '255,220,140'});
  }
  for (let i = 0; i < 10; i++) dust.push({x:x + (Math.random() - .5) * 60, y:y + (Math.random() - .5) * 40, vx:(Math.random() - .5) * 160, vy:-Math.random() * 120, r:12 + Math.random() * 14, t:0, max:.8 + Math.random() * .6});
  impactFx(x, Math.random() < .5 ? 1 : -1, y > g - 70, 1.15);
  const v = Math.max(0, 1 - Math.abs(x - me.x) / 1100);
  if (v > 0){ shake = Math.max(shake, 26 * v); ifl = Math.max(ifl, .35 * v); sndExplode(v); }
}
// 폭발 판정은 쏜 사람 쪽에서: 폭심 가까우면 분쇄(bz:2), 범위 안이면 큰 피해(bz:1)
function detonate(x, y, sc){
  sc = sc || 1;
  explodeFx(x, y);
  if (!online) return;
  channel.send({type:'broadcast', event:'ex', payload:{x:+x.toFixed(1), y:+y.toFixed(1), i:myId}});
  for (const id in others){
    const o = others[id]; if (o.hp <= 0) continue;
    const d = Math.hypot(o.x - x, o.y - (o.ad ? 60 : o.tk >= 0 ? 48 : isProne(o) ? 18 : o.ps === 1 ? 30 : 40) - y);
    if (d > 165 * sc) continue;
    channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:o.x >= x ? 1 : -1, dmg:Math.round(Math.max(30 * sc, 80 * sc * (1 - d / (175 * sc)))), kb:520, st:.55, gm:3, m:0, a:myId, ar:0, bz:d < 85 * sc ? 2 : 1, lc:.8}});
  }
}

  for (let i = 0; i < 16; i++) g('c', 0, 2 + Math.random() * 4, Math.random() < .6 ? '#7a1010' : '#000');

// 잘린 다리 단면에서 피가 떨어지고, 기어 다니면 바닥에 핏자국을 남김
function tickStumps(p, dt){

/* ---------- 타격 이펙트 (스파크, 데미지 숫자, 사운드) ----------
   type 0 일반 타격 / 1 방패 막기 / 2 패링 / 3 가드 브레이크 */
function hitFx(x, y, type, pw, dmg, dir, ar, hy, ch){
  ch = ch || 56;
  const cy = y - ch, by = y - (ar && hy ? hy : ch);
  const vol = Math.max(0, 1 - Math.abs(x - me.x) / 900);
  const c = type === 1 ? '190,220,255' : type === 2 ? '255,235,120' : type === 3 ? '255,170,80' : '255,228,170';
  const n = type === 0 ? (ar ? 3 : 6 + Math.round(pw * 16)) : type === 2 ? 18 : type === 3 ? 20 : 8;
  const sgn = type === 0 ? dir : -dir;
  for (let i = 0; i < n; i++){
    const a = (Math.random() - .5) * 2.4, sp = 220 + Math.random() * (300 + pw * 450);
    sparks.push({x:x - dir * 4, y:cy + (Math.random() - .5) * 14, vx:Math.cos(a) * sp * sgn, vy:Math.sin(a) * sp - 50, t:0, life:.18 + Math.random() * .25, w:1 + Math.random() * 1.6, c});
  }
  bursts.push({x, y:cy, t:0, r:12 + pw * 34 + (type === 2 ? 16 : 0), c});
  if ((type === 0 || type === 3) && dmg > 0) bleed(x, by, dir, pw, !!ar);
  if (ar && type === 0) sndThunk(vol);
  if (type === 0 && pw > .5) rings.push({x, y:cy, f:dir, t:0, s:.3 + pw * .3});
  const label = type === 2 ? 'PARRY!' : type === 3 ? 'BREAK!' : type === 1 ? (dmg > 0 ? 'BLOCK ' + dmg : 'BLOCK') : String(dmg);
  texts.push({x:x + (Math.random() - .5) * 14, y:cy - 34, v:label, t:0, sz:type === 0 ? 14 + Math.round(dmg * .55) : 15, c:type === 0 ? '#ffe9b8' : type === 1 ? '#bcd8ff' : type === 2 ? '#ffe36a' : '#ffae55'});
  if (vol > 0){
    shake = Math.max(shake, (type === 0 ? 3 + pw * 12 : type === 1 ? 3 : 7) * vol);
    if (type === 2) ifl = Math.max(ifl, .12 * vol);
  }
  if (type === 0) sndHit(vol, pw); else if (type === 1) sndBlock(vol); else if (type === 2) sndParry(vol); else sndBreak(vol);
}

/* ---------- 피 이펙트 + 몸에 박히는 화살 ---------- */
function bleed(x, y, dir, pw, ar){
  if (blood.length > 320) blood.splice(0, 60);
  const n = 7 + Math.round(pw * 14) + (ar ? 8 : 0);
  for (let i = 0; i < n; i++){
    const a = (Math.random() - .5) * 2.0, sp = 120 + Math.random() * (260 + pw * 320), sg = Math.random() < .7 ? dir : -dir;
    blood.push({x:x + (Math.random() - .5) * 6, y:y + (Math.random() - .5) * 10, vx:Math.cos(a) * sp * sg, vy:Math.sin(a) * sp - 90 - Math.random() * 120, r:1.2 + Math.random() * 2.2, t:0, life:.9 + Math.random() * .7});
  }
  for (let i = 0; i < 4; i++) mists.push({x, y, vx:dir * (40 + Math.random() * 80), vy:-Math.random() * 40, r:4 + Math.random() * 5, t:0, max:.3 + Math.random() * .2});
}
function addArrow(p, dir, hy, an){
  if (p.arrows.length >= 8) p.arrows.shift();
  // 박힌 화살은 죽거나 리스폰할 때까지 몸에 남음 (피는 처음 6초만 흐름)
  p.arrows.push({d:dir, an:an == null ? null : +an, ox:dir * 2, oy:Math.max(8, Math.min(bodyH(p) - 2, hy || 50)), tilt:(Math.random() - .5) * .3, t:0, life:60, drip:.05});
}
function tickArrows(p, dt){
  for (let i = p.arrows.length - 1; i >= 0; i--){
    const a = p.arrows[i]; a.t += dt;
    if (a.t < 6){
      a.drip -= dt;
      if (a.drip <= 0){
        a.drip = .18 + Math.random() * .25;
        if (blood.length < 320) blood.push({x:p.x + a.ox, y:p.y - a.oy + 2, vx:(Math.random() - .5) * 20, vy:0, r:1.3 + Math.random(), t:0, life:1.2});
      }
    }
    if (a.t > a.life) p.arrows.splice(i, 1);
  }
}
function drawArrows(p){
  for (const a of p.arrows){
    const tx = p.x + a.ox, ty = p.y - a.oy, ca = a.an != null ? Math.cos(a.an) : a.d, sa = a.an != null ? Math.sin(a.an) : -a.tilt, ex = tx - ca * 22, ey = ty - sa * 22;
    ctx.save(); ctx.globalAlpha *= Math.min(1, (a.life - a.t) / 1);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8a6f4a'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#d8d2c2'; ctx.lineWidth = 1.6;
    const fx = tx - ca * 17, fy = ty - sa * 17;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(ex - a.d * 2, ey - 3.5); ctx.moveTo(fx, fy); ctx.lineTo(ex - a.d * 2, ey + 3.5); ctx.stroke();
    ctx.fillStyle = 'rgba(160,18,18,.95)'; ctx.beginPath(); ctx.arc(tx - a.d * 2, ty, 2.6, 0, 7); ctx.fill();
    ctx.restore();
  }
}

// 공격한 쪽이 받는 피드백 (히트스톱, 진동, 패링당하면 휘청). 기관단총은 생략
function attackerFeedback(p){
  if (p.sm) return;
  slow = Math.max(slow, .03 + .08 * p.pw * (p.t === 2 ? .5 : 1));
  if (p.t === 2 && p.m){
    me.stun = Math.max(me.stun, .6); me.vx = -p.f * 340; me.vy = -170; me.pt = -1; me.sw = false; me.cd = Math.max(me.cd, .5);
    slow = Math.max(slow, .09);
  } else if (p.t === 1 && p.m){ me.vx = -p.f * 110; }
  if (navigator.vibrate){ try { navigator.vibrate(p.t === 0 ? 25 + Math.round(p.pw * 40) : 18); } catch(e){} }
}

// 내가 맞았을 때 (방패/패링/가드 브레이크/분쇄/절단 판정은 맞는 쪽에서)
function takeHit(p){
  if (me.inv > 0) return;   // 발도술 돌진 중 무적
  if (me.ad){ adHit(p); return; }          // 스매셔로 변신 중이면 스매셔 체력으로 받음
  if (me.tk >= 0){ tankHit(p); return; }   // 전차 탑승 중이면 전차가 대신 맞음
  let dmg = p.dmg || 0, kb = p.kb == null ? 200 : p.kb, st = p.st || .1, type = 0;
  const bz = p.bz || 0, ch = isProne(me) ? 24 : me.ps === 1 ? 40 : 56;
  const pw = Math.min(1, dmg / 26 * .6 + Math.abs(kb) / 700 * .4);
  const pwin = bz ? PARRY * 1.7 : PARRY;
  const front = !p.trp && me.g && me.f === -p.dir && (!bz || (me.gt < pwin && me.pOk));      // 폭발은 일반 방패로는 못 막고, 패링 타이밍에만 막을 수 있음
  if (front){
    if (me.gt < pwin && me.pOk){
      type = 2; dmg = 0; kb = 0; st = 0; me.gg = Math.min(100, me.gg + 20); me.bf = .2; me.bt = 2;
    } else {
      me.gg -= dmg * (p.gm || 1) * 1.5;
      if (me.gg <= 0){
        type = 3; me.gg = 0; me.glock = true; me.g = false; dmg = Math.round(dmg * .4); kb = Math.max(kb, 300); st = .9; me.bf = .25; me.bt = 3;
      } else {
        type = 1; dmg = Math.max(1, Math.round(dmg * .1)); kb = kb * .3; st = .05; me.bf = .15; me.bt = 1;
      }
    }
  }
  me.hp = Math.max(0, me.hp - dmg);
  // 바주카: 직격(또는 폭발로 사망)하면 몸이 산산조각
  if (type !== 2 && bz && (bz === 2 || me.hp <= 0)){
    me.hp = 0; me.gib = true; deadT = 2.6; me.g = false; me.pt = -1; me.rlOn = false; me.vx = me.vy = 0;
    gibBurst(me.x, me.y, p.dir, me.lg);
    slow = Math.max(slow, .12);
    if (navigator.vibrate){ try { navigator.vibrate([60, 30, 90]); } catch(e){} }
    if (online) channel.send({type:'broadcast', event:'ht', payload:{x:+me.x.toFixed(1), y:+me.y.toFixed(1), t:0, d:0, pw:1, f:p.dir, a:p.a, v:myId, m:0, gb:1, lg:me.lg}});
    sendState(true); return;
  }
  if (type !== 2){
    me.vx = p.dir * kb;
    if (kb > 450) me.vy = -380; else if (kb > 250) me.vy = -210;
    me.stun = Math.max(me.stun, st);
  }
  if (type === 0 || type === 3){
    me.flash = .15;
    if (st > .1){ me.pt = -1; me.sw = false; me.rlOn = false; me.cd = Math.min(me.cd, .35); }
  }
  // 다리 절단 (막지 못한 타격만)
  let lcut = 0;
  if (me.hp > 0 && me.lg < 2 && (type === 0 || type === 3) && Math.random() < (p.lc || 0)){
    lcut = 1; me.lg++; me.stun = Math.max(me.stun, .3);
    spawnLegGib(me.x, me.y, p.dir);
    if (me.lg >= 2){ me.pt = -1; me.sw = false; me.g = false; me.ps = 0; }
  }
  if (me.hp <= 0){ deadT = 1.8; me.g = false; }
  hitFx(me.x, me.y, type, pw, dmg, p.dir, p.ar, p.hy, ch);
  if (p.ar && (type === 0 || type === 3)) addArrow(me, p.dir, p.hy, p.an);
  if (!p.sm){
    slow = Math.max(slow, .03 + .07 * pw);
    if (navigator.vibrate){ try { navigator.vibrate(type === 0 ? 30 + Math.round(pw * 50) : 20); } catch(e){} }
  }
  if (online) channel.send({type:'broadcast', event:'ht', payload:{x:+me.x.toFixed(1), y:+me.y.toFixed(1), t:type, d:dmg, pw:+pw.toFixed(2), f:p.dir, a:p.a, v:myId, m:p.m ? 1 : 0, ar:p.ar ? 1 : 0, hy:p.hy, an:p.an, ch, lcut, sm:p.sm ? 1 : 0}});
  sendState(true);
}

/* ---------- 네트워크 (Supabase Realtime) ---------- */
let channel = null, online = false;
const configured = !SUPABASE_URL.includes("YOUR_PROJECT");
function connect(){
  if (!configured) return;
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {realtime:{params:{eventsPerSecond:60}}});
  channel = sb.channel('rain-arena', {config:{broadcast:{self:false}}});
  channel.on('broadcast', {event:'s'}, ({payload:p}) => {
    let o = others[p.i];
    if (!o){ o = others[p.i] = mk(p.x); o.ty = p.y; o.y = p.y; }
    if (o.hp <= 0 && p.h > 0) o.arrows = [];
    o.tx = p.x; o.ty = p.y; o.f = p.f; o.hp = p.h; o.w = p.w || 0; o.moving = p.m; o.g = !!p.g; o.n = String(p.n || '').slice(0, 10); o.seen = performance.now();
    o.lg = p.lg || 0; o.gib = !!p.gb;
    o.ps = p.ps || 0; o.tk = p.tk == null ? -1 : p.tk; o.th = p.th || 0;
    if (!!p.ad !== !!o.ad) adFx(o.tx, o.ty);   // 상대가 변신/해제할 때 연출
    o.ad = p.ad ? 1 : 0; o.ah = p.ah || 0;
    o.cv = (p.bc || 0) / 10;   // 활 차징 정도 (0~1)
    o.aim = p.ai ? p.ai / 20 : BOW_MIN;   // 활 조준각
    // 산데비스탄 켜짐/꺼짐 연출 + 상태 동기화
    if (!!p.sv !== o.sv) svFx(o.tx, o.ty, p.sv ? 1 : 0, Math.max(0, 1 - Math.abs(o.tx - me.x) / 900));
    o.sv = !!p.sv;
    if (p.rl && !o.rlPrev){
      o.rlOn = true; o.rlt = 0;
      const rw = WEAPONS[o.w]; if (rw && rw.rl) reloadSfx(rw, Math.max(0, 1 - Math.abs(o.tx - me.x) / 900));
    }
    if (!p.rl) o.rlOn = false;
    o.rlPrev = !!p.rl;
    if (p.pu && !o.pu && o.pt < 0){ o.pt = 0; o.sw = false; } o.pu = p.pu;
  });
  channel.on('broadcast', {event:'hit'}, ({payload:p}) => {
    if (p.to !== myId || me.hp <= 0) return;
    takeHit(p);
  });
  channel.on('broadcast', {event:'ht'}, ({payload:p}) => {
    const o = others[p.v];
    if (p.gb){ if (o) o.gib = true; gibBurst(p.x, p.y, p.f, p.lg || 0); }
    else {
      hitFx(p.x, p.y, p.t, p.pw, p.d, p.f, p.ar, p.hy, p.ch);
      if (p.lcut) spawnLegGib(p.x, p.y, p.f);
      if (o){
        o.bf = .18; o.bt = p.t; if (p.t === 0 || p.t === 3) o.flash = .12;
        if (p.ar && (p.t === 0 || p.t === 3)) addArrow(o, p.f, p.hy, p.an);
      }
    }
    if (p.a === myId) attackerFeedback(p);
  });
  channel.on('broadcast', {event:'b'}, ({payload:p}) => {
    const w = WEAPONS[p.k]; if (!w) return;
    let o = others[p.i]; if (!o) o = others[p.i] = mk(p.x);
    o.f = p.f; o.rc = w.rk ? .2 : .12; if (!w.hid) o.w = p.k;
    o.cv = 0;
    spawnShot(p.x, p.y, p.f, p.k, false, p.sh, p.i, p.pw, p.th);
    const v = Math.max(0, 1 - Math.abs(p.x - me.x) / 900);
    if (w.smg) sndSmg(v); else if (w.rk) sndBazooka(v); else twang(v);
  });
  channel.on('broadcast', {event:'kw'}, ({payload:p}) => {
    spawnWave(p.x, p.y, p.f, false, p.i); katanaArc(p.x, p.y, p.f, 1); sndSlash(Math.max(0, 1 - Math.abs(p.x - me.x) / 900));
  });
  channel.on('broadcast', {event:'kd'}, ({payload:p}) => {
    dashFx(p.x, p.y, p.f); const o = others[p.i]; if (o) o.dashT = .2;
  });
  channel.on('broadcast', {event:'ex'}, ({payload:p}) => {
    explodeFx(p.x, p.y);
    let bi = -1, bd = 1e9;
    for (let i = 0; i < bullets.length; i++){
      const b = bullets[i]; if (!b.rk || b.own || b.sid !== p.i) continue;
      const d = Math.hypot(b.x - p.x, b.y - p.y); if (d < bd){ bd = d; bi = i; }
    }
    if (bi >= 0) bullets.splice(bi, 1);
  });
  channel.on('broadcast', {event:'fx'}, ({payload:p}) => { impactFx(p.x, p.f, !!p.g, p.s || 1); });
  channel.on('broadcast', {event:'em'}, ({payload:p}) => {
    const o = others[p.i]; if (!o || !EMOTES[p.e]) return;
    o.em = EMOTES[p.e]; o.emt = EMT;
    emoteSfx(Math.max(0, 1 - Math.abs(o.x - me.x) / 900));
  });
  channel.on('broadcast', {event:'bye'}, ({payload:p}) => { delete others[p.i]; });
  channel.subscribe(s => { online = (s === 'SUBSCRIBED'); if (online) sendState(true); });
  addEventListener('beforeunload', () => channel.send({type:'broadcast', event:'bye', payload:{i:myId}}));
}
// 상태가 바뀌었거나 400ms 지났을 때만 전송 (대기 중 메시지 수 절약)
let lastSig = '', lastSendT = 0;
function sendState(force){
  if (!online) return;
  const p = {i:myId, x:+me.x.toFixed(1), y:+me.y.toFixed(1), f:me.f, h:me.hp, w:me.w, m:me.moving, pu:me.pt >= 0, g:me.g ? 1 : 0, n:me.n, lg:me.lg, gb:me.gib ? 1 : 0, rl:me.rlOn ? 1 : 0, ps:me.ps, tk:me.tk, th:Math.round(me.thp), sv:me.sv ? 1 : 0, bc:Math.round(me.cv * 10), ai:me.cv > 0 ? Math.round(me.aim * 20) : 0, ad:me.ad ? 1 : 0, ah:Math.round(me.ahp)};
  const sig = p.x + ',' + p.y + ',' + p.f + ',' + p.h + ',' + p.w + ',' + p.m + ',' + p.pu + ',' + p.g + ',' + p.lg + ',' + p.gb + ',' + p.rl + ',' + p.ps + ',' + p.tk + ',' + p.th + ',' + p.sv + ',' + p.bc + ',' + p.ai + ',' + p.ad + ',' + p.ah, now = performance.now();
  if (!force && sig === lastSig && now - lastSendT < 400) return;
  lastSig = sig; lastSendT = now;
  channel.send({type:'broadcast', event:'s', payload:p});
}
setInterval(() => sendState(false), 66);

/* ---------- 근접 공격 판정 ---------- */
function doMelee(cw){
  for (const id in others){
    const o = others[id]; if (o.hp <= 0) continue;
    const dx = (o.x - me.x) * me.f, dy = Math.abs(o.y - me.y);
    if (dx > -8 && dx < cw.reach + (o.tk >= 0 ? 90 : o.ad ? 40 : 0) && dy < 64){
      let dmg = cw.dmg;
      if (cw.sp) dmg *= dx > 86 ? 1.4 : dx < 44 ? .6 : 1;   // 창은 끝부분이 가장 강함
      if (online) channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:me.f, dmg:Math.max(1, Math.round(dmg)), kb:cw.kb, st:cw.st, gm:cw.gm, m:1, a:myId, lc:cw.lc || 0}});
    }
  }
  if (cw.hm){
    const ix = me.x + me.f * 66, gnd = me.y > gy(ix) - 50;
    impactFx(ix, me.f, gnd, .55);
    if (online) channel.send({type:'broadcast', event:'fx', payload:{x:+ix.toFixed(1), f:me.f, g:gnd ? 1 : 0, s:.55}});
  }
}

/* ---------- 업데이트 ---------- */
function update(dt){
  const realDt = dt;   // 실제 흐른 시간. 아래 dt 는 구간마다 "그 대상의 시간"으로 바꿔 쓴다
  // 산데비스탄: 누가 켰는지 보고 월드 시간 배율(wsc)을 부드럽게 조절
  let anySv = me.sv;
  for (const id in others){ const o = others[id]; if (o.sv && o.hp > 0) anySv = true; }
  svAny = anySv;
  wsc += ((anySv ? SV_SLOW : 1) - wsc) * Math.min(1, realDt * 5);
  // 산데비스탄 에너지 (실제 시간 기준): 켜면 소모, 끄면 회복. 바닥나면 과열 잠금
  // 아담 스매셔로 변신 중이면 소모량이 훨씬 적어서 오래 유지할 수 있음
  if (me.sv){
    me.svE -= (me.ad ? SV_DRAIN_AD : SV_DRAIN) * realDt;
    if (me.svE <= 0){ me.svE = 0; me.svLock = true; svOff(); }
    else if (me.hp > 0 && me.tk < 0){
      me.gacc += realDt;
      if (me.gacc > .05){ me.gacc = 0; pushGhost(me); }   // 나만 남는 잔상
    }
  } else {
    me.svE = Math.min(100, me.svE + 7 * realDt);
    if (me.svLock && me.svE >= 40) me.svLock = false;
  }
  me.emt = Math.max(0, me.emt - realDt); me.emcd = Math.max(0, me.emcd - realDt);
  me.adcd = Math.max(0, me.adcd - realDt);
  if (me.ad){ me.adT -= realDt; if (me.adT <= 0) endAd(15, false); }
  dt = realDt * tsOf(me);   // 내 시간: 산데비스탄이면 조금 빠르게, 남이 켰으면 느리게
  const g0 = gy(me.x);
  const cw = WEAPONS[me.w];
  me.pcd = Math.max(0, me.pcd - dt);
  if (me.hp > 0){
    const stunned = me.stun > 0;
    me.stun = Math.max(0, me.stun - dt);
    // 방패: 누르는 동안 가드 (공격 중/기절 중/엎드림/전차 안에선 불가)
    const wantG = keys.S && !stunned && me.pt < 0 && !me.glock && me.tk < 0 && !me.ad && me.ps !== 2;
    if (wantG){
      if (!me.g){ me.g = true; me.gt = 0; me.pOk = me.pcd <= 0; me.pcd = .7; }
      else me.gt += dt;
    } else { me.g = false; me.gt = 0; }
    if (!me.g){
      me.gg = Math.min(100, me.gg + 26 * dt);
      if (me.glock && me.gg >= 35) me.glock = false;
    }
    const dir = stunned ? 0 : (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
    // 이동속도: 원거리 무기는 들고 쏘면서도 이동 가능, 다리가 잘리면 느려지고 둘 다 잘리면 기어 다님, 앉기/엎드리기는 더 느림
    const lgm = (me.lg >= 2 ? .26 : me.lg ? .72 : 1) * (me.lg >= 2 ? 1 : me.ps === 2 ? .3 : me.ps === 1 ? .55 : 1);
    const mvm = me.ad ? .78 : me.tk >= 0 ? .72 : (me.pt >= 0 ? cw.mv : me.g ? .38 : cw.t === 'r' ? cw.mv : 1) * lgm * (me.bc > 0 ? .55 : 1);   // 활 차징 중엔 느려짐
    if (stunned) me.vx *= Math.max(0, 1 - dt * 5);
    else if (dir){
      if (me.pt < 0 && !me.g) me.f = dir;      // 휘두르는 중/가드 중엔 방향 고정
      me.vx += (dir * SPEED * mvm - me.vx) * Math.min(1, dt * 12);
    }
    else me.vx *= Math.max(0, 1 - dt * 10);
    if (wantJump && !stunned && me.tk < 0 && me.ps > 0 && me.lg < 2 && me.bc <= 0){ me.ps = 0; wantJump = false; }   // 앉은/엎드린 상태에서 점프 = 일어서기
    else if (wantJump && !stunned && me.tk < 0 && me.lg < 2 && me.bc <= 0 && me.y >= g0 - 0.5){ me.vy = -JUMP * (me.ad ? .6 : me.lg ? .78 : 1); }
    if (me.dash > 0){
      me.dash -= dt; me.vx = me.f * 1500; ghosts.push({p:{...me, arrows:[], flash:1, g:false}, t:0});
      if (me.dash <= 0){ me.vx = me.f * 120; dashHit(); }
    }
    // 장전 진행
    if (me.rlOn){
      me.rlt += dt;
      if (me.stun > .1 || !cw.rl) me.rlOn = false;
      else if (me.rlt >= cw.rl){ me.rlOn = false; me.ammo[me.w] = cw.max; sendState(true); }
    }
  } else {
    me.vx *= Math.max(0, 1 - dt * 6);
    me.rlOn = false;
    if (me.sv) svOff();
    deadT -= dt;
    if (deadT <= 0){
      me.hp = 100; me.x = 300 + Math.random() * (WORLD - 600); me.y = 0; me.vx = me.vy = 0; me.pt = -1; me.stun = 0;
      me.g = false; me.gg = 100; me.glock = false; me.arrows = []; me.ammo = WEAPONS.map(w => w.max || 0);
      me.lg = 0; me.gib = false; me.dash = 0; me.km = 0; me.inv = 0; me.ps = 0; me.tk = -1;
      me.sv = false; me.svE = 100; me.svLock = false; me.bc = 0; me.cv = 0; me.ad = 0;
    }
  }
  me.vy += GRAV * dt; me.x += me.vx * dt; me.y += me.vy * dt;
  me.x = Math.max(20, Math.min(WORLD - 20, me.x));
  const g1 = gy(me.x);
  if (me.y > g1){ me.y = g1; me.vy = 0; }
  me.moving = me.y >= g1 - 1 && Math.abs(me.vx) > 20;
  if (me.moving) me.walk += dt * (me.lg >= 2 || me.ps === 2 ? 6 : 11);
  me.flash = Math.max(0, me.flash - dt);
  me.bf = Math.max(0, me.bf - dt);
  tickArrows(me, dt); tickStumps(me, dt);

  // 무기: 공격 입력, 근접 판정, 화살/총알/로켓
  me.cd = Math.max(0, me.cd - dt); me.rc = Math.max(0, me.rc - dt);
  me.kc1 = Math.max(0, me.kc1 - dt); me.kc2 = Math.max(0, me.kc2 - dt); me.inv = Math.max(0, me.inv - dt);
  bowTick(dt);
  if (keys.A && started) attack();
  WEAPONS.forEach((g, i) => { if (g.t === 'r' && !g.rl && me.ammo[i] < g.max){ regen[i] = (regen[i] || 0) + dt; if (regen[i] > g.rg){ regen[i] = 0; me.ammo[i]++; } } });
  if (me.pt >= 0 && cw.t === 'm'){
    me.pt += dt;
    if (!me.sw && me.pt >= cw.dur * cw.w1){ me.sw = true; whoosh(1, cw.dmg / 26); }
    if (!me.hitDone && me.pt > cw.dur * (cw.w2 - .05)){
      me.hitDone = true;
      if (me.km === 1){
        spawnWave(me.x, me.y, me.f, true, myId); katanaArc(me.x, me.y, me.f, 1); sndSlash(1);
        if (online) channel.send({type:'broadcast', event:'kw', payload:{i:myId, x:+me.x.toFixed(1), y:+me.y.toFixed(1), f:me.f}});
      } else { doMelee(cw); if (cw.kt){ katanaArc(me.x, me.y, me.f, 0); sndSlash(.6); } }
    }
    if (me.pt >= cw.dur){ me.pt = -1; me.km = 0; }
  }
  dt = realDt * wsc;   // 여기부터는 월드(탄/이펙트) 시간: 산데비스탄이 켜져 있으면 느려짐
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i], px = b.x;
    const bdt = dt;   // 산데비스탄 중엔 누가 쏜 탄이든 전부 느려짐
    b.vy += (b.g || 0) * bdt; b.x += b.vx * bdt; b.y += b.vy * bdt; b.life -= bdt;
    if (b.rk) dust.push({x:b.x - b.f * 14, y:b.y, vx:-b.f * 20, vy:-10 - Math.random() * 20, r:3, t:0, max:.6});
    let dead = b.life <= 0 || b.y > gy(b.x);
    if (b.own && !dead && online){
      const lo = Math.min(px, b.x) - 14, hi = Math.max(px, b.x) + 14;
      for (const id in others){
        const o = others[id], top = bodyH(o), hw = bodyW(o);
        if (o.hp > 0 && o.x > lo - hw && o.x < hi + hw && b.y > o.y - top && b.y < o.y){
          dead = true;
          if (b.rk) break;                                   // 로켓은 아래에서 폭발 처리
          const wp = WEAPONS[b.k], hy = Math.round(Math.max(8, Math.min(top - 2, o.y - b.y)));
          const lc = hy < 36 ? (wp.lc || 0) : 0;
          if (b.smg) channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:b.f, dmg:b.dmg, kb:b.kb, st:b.st, gm:b.gm, m:0, a:myId, ar:0, sm:1, lc}});
          else {
            const dm = Math.abs(b.x - b.sx) < 140 ? .6 : 1;   // 너무 가까우면 위력 감소
            channel.send({type:'broadcast', event:'hit', payload:{to:id, dir:b.f, dmg:Math.max(1, Math.round(b.dmg * dm)), kb:b.kb, st:b.st, gm:b.gm, m:0, a:myId, ar:1, hy, lc, an:+Math.atan2(b.vy, b.vx).toFixed(2)}});
          }
          break;
        }
      }
    }
    if (dead){ if (b.rk && b.own) detonate(b.x, b.y); bullets.splice(i, 1); }
  }
  for (let i = muz.length - 1; i >= 0; i--){ muz[i].t -= dt; if (muz[i].t <= 0) muz.splice(i, 1); }

  // 크레이터: 빠르게 파이고, 일정 시간 뒤 서서히 복구
  for (let i = craters.length - 1; i >= 0; i--){
    const c = craters[i]; c.age += dt;
    let k = Math.min(1, c.age / .1); k = 1 - (1 - k) * (1 - k);
    c.k = k;
  }
  for (let i = debris.length - 1; i >= 0; i--){
    const d = debris[i]; d.t += dt;
    d.vy += GRAV * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    const g = gy(d.x);
    if (d.y > g){ d.y = g; d.vy = -d.vy * .35; d.vx *= .6; d.vr *= .6; if (Math.abs(d.vy) < 40){ d.vy = 0; d.vr = 0; d.vx = 0; } }
    if (d.t > d.life) debris.splice(i, 1);
  }
  // 분쇄된 살점/뼈: 튀다가 바닥에 굴러서 남음
  for (let i = gibs.length - 1; i >= 0; i--){
    const g = gibs[i]; g.age += dt;
    g.vy += GRAV * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.vr * dt;
    if (g.age < 2 && Math.random() < dt * 10 && blood.length < 340) blood.push({x:g.x, y:g.y, vx:g.vx * .2, vy:0, r:1.4 + Math.random() * 1.6, t:0, life:1});
    const gr = gy(g.x) - (g.r || 3);
    if (g.y > gr){ g.y = gr; g.vy = -g.vy * .3; g.vx *= .6; g.vr *= .5; if (Math.abs(g.vy) < 50){ g.vy = 0; g.vx = 0; g.vr = 0; } }
    if (g.age > g.life) gibs.splice(i, 1);
  }
  for (let i = fires.length - 1; i >= 0; i--){ fires[i].t += dt; if (fires[i].t > .5) fires.splice(i, 1); }
  for (let i = ghosts.length - 1; i >= 0; i--){ ghosts[i].t += realDt; if (ghosts[i].t > (ghosts[i].life || .3)) ghosts.splice(i, 1); }
  for (let i = slashes.length - 1; i >= 0; i--){ slashes[i].t += realDt; if (slashes[i].t > .3) slashes.splice(i, 1); }
  for (let i = arcs.length - 1; i >= 0; i--){ arcs[i].t += realDt; if (arcs[i].t > .22) arcs.splice(i, 1); }
  for (let i = waves.length - 1; i >= 0; i--){
    const w = waves[i], wd = dt; w.t += wd; w.x += w.vx * wd;
    if (w.own && online) for (const id in others){

const lerp = (a, b, t) => a + (b - a) * t;
const mix = (a, b, s) => [lerp(a[0], b[0], s), lerp(a[1], b[1], s)];
function limb(x, y, a1, l1, a2, l2, f){

}
function limbPos(x, y, a1, l1, a2, l2, f){

// 어깨에서 목표점까지 팔 뻗기 (팔꿈치 자동 계산)
function armTo(sx, sy, tx, ty, f, up){
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 1;

  return [sx + dx, sy + dy];
}
// 무기 각도: 대기 -> 뒤로 젖힘 -> 앞으로 휘두름 -> 복귀
function swingAngle(wp, t){
  if (wp.sp){
    if (t < 0) return 1.35;
    return t < wp.w1 ? lerp(1.35, 1.9, t / wp.w1) : t < wp.w2 ? lerp(1.9, 1.5, (t - wp.w1) / (wp.w2 - wp.w1)) : lerp(1.5, 1.35, (t - wp.w2) / (1 - wp.w2));

  const idle = 2.6, up = wp.hm ? 4.1 : wp.ax ? 3.9 : 3.7;
  if (t < 0) return idle;
  if (t < wp.w1) return lerp(idle, up, t / wp.w1);
  if (t < wp.w2) return lerp(up, 1.4, (t - wp.w1) / (wp.w2 - wp.w1));

}

}

/* --- 기관단총: 장전 모션 (u: 0~1) 탄창 분리 → 허리춤에서 새 탄창 → 삽입 → 장전손잡이 당김 --- */
function smgHand(u, gx, gyy, f, belt){

  if (u < 0) return {h:grip};

  else if (u < .5) h = belt;
  else if (u < .78) h = mix(belt, well, (u - .5) / .28);

/* --- 바주카: 포신을 숙이고 → 등 뒤에서 로켓을 꺼내 → 뒤쪽으로 밀어 넣고 → 다시 어깨에 거치 --- */

  const ax = [f * Math.cos(t), Math.sin(t)], rr = [sx - f * 26 * Math.cos(t), sy - 7 - 26 * Math.sin(t)];

  let gs = null;
  if (gun){
    gs = wp.smg ? smgHand(ru, fh[0], fh[1], f, crawl ? [x - f * 10, p.y - 8] : [x + f * 3, p.y - (cr1 ? 26 : 40)]) : bzHand(ru, sx0, sy0, f);
    armTo(sx0, sy0, gs.h[0], gs.h[1], f, crawl);
    ctx.beginPath(); ctx.arc(gs.h[0], gs.h[1], 3.5, 0, 7); ctx.fill();
  } else if (crawl) cArm(1);
  else { const a = air ? -0.75 : -0.14 + Math.sin(ph + Math.PI) * 0.7 * mv; limb(sx0, sy0, a, 15, a + 0.5 * mv, 15, f); }
  // 앞쪽 팔
  const [fx, fy] = cFront ? cArm(0) : limb(sx0, sy0, fa, 15, fe, 15, f);
  ctx.beginPath(); ctx.arc(fx, fy, 4.5, 0, 7); ctx.fill();
  if (guard) drawShield(fx + f * 2, fy - 2, f, p.bf, p.bt);
  else if (gun && wp.smg){
    drawSMG(fx, fy, f, ru, p.rc || 0);
    if (gs.hold) ctx.fillRect(gs.h[0] - 2.5, gs.h[1] - 14, 5, 15);
    if (gs.fall){ const q = gs.fall; ctx.save(); ctx.translate(q[0], q[1]); ctx.rotate(q[2]); ctx.globalAlpha *= q[3]; ctx.fillRect(-2.5, -7, 5, 15); ctx.restore(); }
  } else if (gun){
    drawBazooka(sx0, sy0, f, gs.t, p.rc || 0, ru < 0 ? (p === me ? me.ammo[me.w] >= 1 : true) : ru >= .85);
    if (gs.hold) drawRocket(gs.h[0], gs.h[1], gs.ax);
  }
  else if (ranged) drawBow(fx, fy, f, p.rc || 0, p.cv || 0, p.aim);
  else {
    const ba = swingAngle(wp, t);
    if (t >= 0 && !wp.sp && t >= wp.w1 && t < wp.w2 + .04) swingTrail(wp, fx, fy, f, ba);
    drawWeapon(wp, fx, fy, f, ba, t);
  }
  drawArrows(p);
  ctx.restore();
  // 체력바 + 닉네임
  if (p.hp > 0 && !ghost){
    const top = crawl ? 40 : cr1 ? 74 : 100;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x - 18, p.y - top, 36, 4);
    ctx.fillStyle = '#b33'; ctx.fillRect(x - 18, p.y - top, 36 * p.hp / 100, 4);
    if (p.cv > 0){   // 활 차징 게이지
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x - 18, p.y - top + 6, 36, 3);
      ctx.fillStyle = p.cv >= 1 ? '#fff2a8' : '#e0a93a'; ctx.fillRect(x - 18, p.y - top + 6, 36 * Math.min(1, p.cv), 3);
    }
    if (label){ ctx.fillStyle = '#9aa0a8'; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, x, p.y - top - 6); }
  }
}

/* --- 전차 (시점 기준 오른쪽이 앞) --- */
function rrect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* --- 아담 스매셔: 해골 얼굴 + 붉은 눈, 거대한 크롬 사이보그, 팔에 달린 미니건 / 등에 미사일 포드 --- */
function drawAdam(p, hp, label, ghost){
  const x = p.x, y = p.y, f = p.f, rc = p.rc || 0, AS = 1.5, edge = p.gc || 'rgba(165,172,186,.9)', BODY = p.gc || '#0b0b0d', mv = p.moving ? 1 : 0, air = p.y < gy(p.x) - 2;
  ctx.save(); ctx.translate(x, y); ctx.scale(f * AS, AS);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const limbs = (pts, w) => {
    ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
    ctx.strokeStyle = edge; ctx.lineWidth = w + 2; ctx.stroke(); ctx.strokeStyle = BODY; ctx.lineWidth = w; ctx.stroke();
  };
  // 다리
  for (let i = 0; i < 2; i++){
    const ph = p.walk + i * Math.PI, th = air ? (i ? .5 : -.25) : Math.sin(ph) * .7 * mv, kn = air ? .6 : Math.max(0, Math.cos(ph)) * .9 * mv;
    const kx = Math.sin(th) * 19, ky = -36 + Math.cos(th) * 19, ex = kx + Math.sin(th - kn) * 19, ey = ky + Math.cos(th - kn) * 19;
    limbs([[0, -36], [kx, ky], [ex, ey]], 8);
    ctx.fillStyle = BODY; ctx.strokeStyle = edge; ctx.lineWidth = 1.2; ctx.fillRect(ex - 3, ey - 2, 11, 5); ctx.strokeRect(ex - 3, ey - 2, 11, 5);
  }
  // 등의 미사일 포드
  ctx.fillStyle = BODY; ctx.strokeStyle = edge; ctx.lineWidth = 1.3;
  ctx.fillRect(-22, -80, 10, 14); ctx.strokeRect(-22, -80, 10, 14);
  ctx.fillStyle = '#c33'; for (let k = 0; k < 3; k++){ ctx.beginPath(); ctx.arc(-17, -77 + k * 4.2, 1.3, 0, 7); ctx.fill(); }
  // 뒤쪽 팔
  limbs([[-10, -64], [-15, -50], [-12, -37]], 7);
  // 몸통 (넓은 어깨) + 가슴 코어
  ctx.fillStyle = BODY; ctx.strokeStyle = edge; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(-11, -34); ctx.lineTo(-18, -62); ctx.lineTo(-9, -69); ctx.lineTo(11, -69); ctx.lineTo(19, -62); ctx.lineTo(12, -34); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(165,172,186,.55)'; ctx.beginPath(); ctx.moveTo(-8, -46); ctx.lineTo(10, -46); ctx.moveTo(-6, -41); ctx.lineTo(8, -41); ctx.stroke();
  ctx.fillStyle = 'rgba(255,50,50,.9)'; ctx.beginPath(); ctx.arc(3, -56, 3, 0, 7); ctx.fill();
  // 머리: 해골 + 이빨 + 붉은 눈
  ctx.fillStyle = BODY; ctx.strokeStyle = edge; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(2, -78, 9, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillRect(-2, -72, 13, 5); ctx.strokeRect(-2, -72, 13, 5);
  ctx.strokeStyle = 'rgba(235,235,240,.9)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let k = 0; k < 6; k++){ ctx.moveTo(-1 + k * 2.2, -72); ctx.lineTo(-1 + k * 2.2, -67.5); }
  ctx.stroke();
  if (!ghost){ ctx.shadowColor = '#ff2020'; ctx.shadowBlur = 10; } ctx.fillStyle = '#ff3535';
  ctx.beginPath(); ctx.arc(7, -80, 2.6, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  // 앞쪽 팔 = 미니건 (발사하면 총신이 회전하고 총구 화염)
  limbs([[11, -62], [22, -58]], 8);
  ctx.fillStyle = BODY; ctx.strokeStyle = edge; ctx.lineWidth = 1.3;
  ctx.fillRect(18, -65, 13, 13); ctx.strokeRect(18, -65, 13, 13);
  const spin = rc > 0 ? performance.now() / 25 : 0;
  ctx.lineWidth = 2.6; ctx.strokeStyle = '#3a3d44';
  for (let k = 0; k < 3; k++){ const oy = -59 + Math.sin(spin + k * 2.1) * 3.4; ctx.beginPath(); ctx.moveTo(31, oy); ctx.lineTo(51, oy); ctx.stroke(); }
  if (rc > .02){ ctx.fillStyle = 'rgba(255,225,150,.9)'; ctx.beginPath(); ctx.arc(55, -59, 4 + Math.random() * 4, 0, 7); ctx.fill(); }
  ctx.restore();
  if (ghost) return;
  // 체력바 + 닉네임
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - 32, y - 152, 64, 6);
  ctx.fillStyle = hp < ADAM_HP * .3 ? '#ff6a3a' : '#d33'; ctx.fillRect(x - 32, y - 152, 64 * Math.max(0, hp) / ADAM_HP, 6);
  if (label){ ctx.fillStyle = '#9aa0a8'; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, x, y - 159); }
}
function drawTank(p, hp, label){
  const x = p.x, f = p.f, y = p.y, rc = p.rc || 0, edge = 'rgba(150,158,172,.85)', S = TS;
  ctx.save(); ctx.translate(x, y); ctx.scale(f * S, S);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.3; ctx.strokeStyle = edge; ctx.fillStyle = '#0a0a0b';
  // 궤도 + 바퀴 + 굴러가는 마디
  rrect(-44, -15, 88, 15, 7); ctx.fill(); ctx.stroke();
  for (let k = 0; k < 5; k++){ ctx.beginPath(); ctx.arc(-32 + k * 16, -7.5, 4.5, 0, 7); ctx.stroke(); }
  const m = ((-x * f / S) % 9 + 9) % 9;
  ctx.beginPath();
  for (let k = 0; k < 10; k++){ const lx = -40 + m + k * 9; if (lx < 40){ ctx.moveTo(lx, -15); ctx.lineTo(lx, -12); ctx.moveTo(lx, 0); ctx.lineTo(lx, -3); } }
  ctx.stroke();
  // 차체
  ctx.beginPath(); ctx.moveTo(-38, -15); ctx.lineTo(-33, -27); ctx.lineTo(28, -27); ctx.lineTo(41, -19); ctx.lineTo(41, -15); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 포신 (발사하면 뒤로 밀림)
  const rb = rc > 0 ? 9 * rc / .2 : 0;
  rrect(14 - rb, -37.5, 56, 7, 2); ctx.fill(); ctx.stroke();
  // 포탑 + 해치 밖으로 보이는 운전자 머리
  rrect(-18, -42, 36, 16, 6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-4, -47, 5.5, 0, 7); ctx.fill(); ctx.stroke();
  if (rc > .13){ ctx.fillStyle = 'rgba(255,225,150,' + (rc / .2) + ')'; ctx.beginPath(); ctx.arc(74, -34, 5 + 8 * rc / .2, 0, 7); ctx.fill(); }
  ctx.restore();
  // 체력바 + 닉네임
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - 32, y - 120, 64, 6);
  ctx.fillStyle = hp < TANK_HP * .35 ? '#d04a2a' : '#c8892a'; ctx.fillRect(x - 32, y - 120, 64 * Math.max(0, hp) / TANK_HP, 6);
  if (label){ ctx.fillStyle = '#9aa0a8'; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, x, y - 127); }
}

// 비 (망치 풍압에 휩쓸림)
const drops = Array.from({length: 230}, () => ({x:Math.random(), y:Math.random(), l:10 + Math.random() * 16, s:0.9 + Math.random() * 0.8}));
function rain(dt){
  rainWind *= Math.exp(-dt * 2.5);
  if (Math.abs(rainWind) < .01) rainWind = 0;
  const slant = 0.15 - rainWind * 0.35;
  ctx.strokeStyle = 'rgba(170,182,200,.32)'; ctx.lineWidth = 1.2; ctx.lineCap = 'butt';
  ctx.beginPath();
  for (const d of drops){
    d.y += dt * d.s * 1.1; d.x += dt * d.s * (rainWind - 0.12);
    if (d.y > 1){ d.y = -0.05; d.x = Math.random() * 1.2; }
    if (d.x < -0.1) d.x = 1.1;
    if (d.x > 1.2) d.x = -0.1;
    const sx = d.x * W, sy = d.y * H;
    ctx.moveTo(sx, sy); ctx.lineTo(sx - d.l * slant, sy + d.l);
  }
  ctx.stroke();
}

/* ---------- 사운드 ---------- */
let ac = null;
function initAudio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ac && ac.state === 'suspended') ac.resume();
}
['pointerdown','keydown'].forEach(e => addEventListener(e, initAudio));
function nz(dur, freq, type, vol, pow){
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, pow || 2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
function tn(f1, f2, dur, vol, type){
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
function sndHit(v, pw){
  if (!ac || v <= 0) return;
  tn(170, 48, .16 + pw * .1, (.45 + pw * .6) * v, 'sine');
  nz(.09 + pw * .08, 1800, 'lowpass', (.5 + pw * .4) * v, 3);
}
function sndThunk(v){
  if (!ac || v <= 0) return;
  tn(320, 110, .09, .35 * v, 'triangle'); nz(.04, 1200, 'lowpass', .3 * v, 2);
}
function sndBlock(v){
  if (!ac || v <= 0) return;
  tn(1250, 1180, .22, .22 * v, 'square'); tn(1870, 1800, .16, .14 * v, 'triangle'); nz(.05, 3500, 'highpass', .4 * v, 2);
}
function sndParry(v){
  if (!ac || v <= 0) return;
  tn(1900, 1800, .5, .3 * v, 'triangle'); tn(2850, 2800, .35, .18 * v, 'sine'); nz(.07, 4500, 'highpass', .5 * v, 2); tn(90, 60, .15, .5 * v, 'sine');
}
function sndBreak(v){
  if (!ac || v <= 0) return;
  nz(.45, 700, 'lowpass', .9 * v, 2); tn(220, 50, .4, .5 * v, 'sawtooth'); sndBlock(v);
}
function whoosh(v, pw){
  if (!ac || v <= 0) return;
  const t = ac.currentTime, dur = .16 + pw * .12, len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(1800, t + dur);
  const g = ac.createGain(); g.gain.value = .22 * v * (.7 + pw * .6);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
}
function twang(v){
  if (!ac || v <= 0) return;
  tn(220, 140, .12, .25 * v, 'triangle'); nz(.05, 2500, 'bandpass', .2 * v, 2);
}
function sndSmg(v){
  if (!ac || v <= 0) return;
  tn(210, 80, .06, .22 * v, 'square'); nz(.05, 2800, 'bandpass', .25 * v, 2);
}
function sndBazooka(v){
  if (!ac || v <= 0) return;
  nz(.5, 600, 'lowpass', .7 * v, 1.5); tn(140, 40, .35, .55 * v, 'sawtooth');
}
function sndExplode(v){
  if (!ac || v <= 0) return;
  nz(.9, 500, 'lowpass', 1.1 * v, 1.5); tn(90, 28, .7, .9 * v, 'sine');
}
function sndGib(v){
  if (!ac || v <= 0) return;
  nz(.35, 900, 'lowpass', .9 * v, 2); tn(120, 40, .3, .6 * v, 'sine'); nz(.15, 300, 'bandpass', .6 * v, 1);
}
function sndChop(v){
  if (!ac || v <= 0) return;
  nz(.08, 1500, 'highpass', .4 * v, 2); tn(200, 80, .1, .4 * v, 'sawtooth');
}
function sndSlash(v){
  if (!ac || v <= 0) return;
  nz(.18, 3500, 'highpass', .4 * v, 2); tn(1400, 500, .15, .15 * v, 'sawtooth'); tn(2600, 1800, .3, .12 * v, 'triangle');
}
function sndDash(v){
  if (!ac || v <= 0) return;
  nz(.25, 2500, 'bandpass', .5 * v, 1.5); tn(2200, 300, .2, .25 * v, 'sawtooth'); tn(3000, 2800, .4, .1 * v, 'sine');
}
// 산데비스탄: 켤 때는 전자음이 치솟고 심장 박동 같은 저음, 끌 때는 반대로 꺼지는 소리
function sndSv(on, v){
  if (!ac || v <= 0) return;
  if (on){
    tn(70, 900, .45, .5 * v, 'sawtooth'); nz(.4, 2000, 'bandpass', .35 * v, 1.5); tn(1200, 2400, .5, .12 * v, 'sine');
    setTimeout(() => { if (ac) tn(60, 38, .5, .6 * v, 'sine'); }, 130);
    setTimeout(() => { if (ac) tn(60, 38, .4, .45 * v, 'sine'); }, 330);
  } else {
    tn(900, 60, .5, .4 * v, 'sawtooth'); nz(.3, 800, 'lowpass', .3 * v, 2);
  }
}
function thunder(){
  if (!ac) return;
  const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){ const k = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 2.2) * (1 + Math.sin(k * 40) * .3); }
  const src = ac.createBufferSource(); src.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160;
  const g = ac.createGain(); g.gain.value = 1.6;
  src.connect(lp); lp.connect(g); g.connect(ac.destination); src.start();
}
// 망치 충격음: 저음 쿵 + 파편 노이즈
function boom(v){
  if (!ac || v <= 0) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(35, t + .35);
  g.gain.setValueAtTime(.9 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .45);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .5);
  const len = Math.floor(ac.sampleRate * .25), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = ac.createBufferSource(); s.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const g2 = ac.createGain(); g2.gain.value = .5 * v;
  s.connect(lp); lp.connect(g2); g2.connect(ac.destination); s.start(t);
}

/* ---------- 번개 ---------- */
let clock = 0, nextBolt = 3, flash = 0, flick = 0, bolt = null, boltT = 0, thunderAt = 0;
function lightningTick(dt){
  clock += dt;
  if (clock > nextBolt){
    flash = 1; flick = clock + 0.1 + Math.random() * 0.1; boltT = 0.3;
    const bx = Math.random() * W; bolt = [[bx, 0]];
    let x = bx, y = 0;
    while (y < H * 0.68){ y += 20 + Math.random() * 40; x += (Math.random() - .5) * 60; bolt.push([x, y]); }
    nextBolt = clock + 6 + Math.random() * 10;
    thunderAt = clock + 0.3 + Math.random() * 1.6;
  }
  if (flick && clock > flick){ flash = 0.8; flick = 0; boltT = 0.2; }
  if (thunderAt && clock > thunderAt){ thunderAt = 0; thunder(); }
  flash = Math.max(0, flash - dt * 2.8); boltT = Math.max(0, boltT - dt);
}

const splashes = []; let splashAcc = 0;
let last = performance.now(), camX = me.x;
function frame(t){
  const rdt = Math.min(0.05, (t - last) / 1000); last = t;
  const dt = slow > 0 ? rdt * 0.1 : rdt;   // 히트스톱 (타격 순간 거의 멈춤)
  slow = Math.max(0, slow - rdt);
  update(dt); lightningTick(dt * wsc);   // 산데비스탄 중엔 번개 주기도 느려짐

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#121417'); gr.addColorStop(0.68, '#44474c'); gr.addColorStop(1, '#101113');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  if (flash > 0){ ctx.fillStyle = 'rgba(215,225,245,' + (flash * 0.6) + ')'; ctx.fillRect(0, 0, W, H); }
  if (boltT > 0 && bolt){
    ctx.save(); ctx.strokeStyle = 'rgba(240,245,255,' + Math.min(1, boltT * 4) + ')'; ctx.lineWidth = 3;
    ctx.shadowColor = '#cfe0ff'; ctx.shadowBlur = 18; ctx.beginPath();
    bolt.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore();
  }
  // 카메라: 내 캐릭터 따라가기 + 화면 흔들림
  const viewW = W / scale;
  const target = Math.max(0, Math.min(WORLD - viewW, me.x - viewW / 2));
  camX += (target - camX) * Math.min(1, rdt * 8);
  shake *= Math.exp(-rdt * 7); if (shake < .3) shake = 0;
  const shx = (Math.random() - .5) * 2 * shake, shy = (Math.random() - .5) * 2 * shake;
  const groundScreen = H * 0.68;
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, (-camX * scale + shx) * DPR, (groundScreen + shy) * DPR);

  // 바닥 (검정, 크레이터 반영)
  const gx0 = camX - 60, gx1 = camX + viewW + 60;
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(gx0, 3000);
  for (let x = gx0; x <= gx1; x += 6) ctx.lineTo(x, gy(x));
  ctx.lineTo(gx1, gy(gx1)); ctx.lineTo(gx1, 3000); ctx.closePath(); ctx.fill();
  // 크레이터: 고인 물, 윤곽선, 균열
  for (const c of craters){
    if (c.x + c.r * 1.5 < gx0 || c.x - c.r * 1.5 > gx1) continue;
    const k = c.k; if (k < .02) continue;
    const lvl = c.d * k * .5;
    ctx.fillStyle = 'rgba(150,170,200,' + (.22 * k) + ')';
    for (let x = c.x - c.r; x < c.x + c.r; x += 4){ const y = gy(x); if (y > lvl) ctx.fillRect(x, lvl, 4.5, y - lvl); }
    ctx.strokeStyle = 'rgba(125,132,145,' + (.45 * k) + ')'; ctx.lineWidth = 1.2; ctx.lineCap = 'round'; ctx.beginPath();
    let first = true;
    for (let x = c.x - c.r * 1.45; x <= c.x + c.r * 1.45; x += 4){ const y = gy(x); if (first){ ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(100,106,118,' + (.55 * k) + ')'; ctx.beginPath();
    for (const cr of c.cracks){
      let x = c.x + cr.x, y = gy(x) + 1; ctx.moveTo(x, y);
      for (const q of cr.p){ x += q[0]; y += q[1]; ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }
  // 바닥에 튕기는 빗물 (산데비스탄 중엔 느리게 튐)
  splashAcc += dt * wsc * 60; let sn = Math.floor(splashAcc); splashAcc -= sn;
  while (sn-- > 0 && splashes.length < 160) splashes.push({x:camX + Math.random() * viewW, t:0, s:.6 + Math.random() * .8});
  ctx.lineWidth = 1;
  for (let i = splashes.length - 1; i >= 0; i--){
    const sp = splashes[i]; sp.t += dt * wsc; const k = sp.t / .32;
    if (k >= 1){ splashes.splice(i, 1); continue; }
    const sy0 = gy(sp.x);
    ctx.strokeStyle = 'rgba(190,205,225,' + (0.55 * (1 - k)) + ')';
    ctx.beginPath(); ctx.ellipse(sp.x, sy0, (2 + k * 9) * sp.s, (1 + k * 2.5) * sp.s, 0, 0, 7); ctx.stroke();
    const h = Math.sin(k * Math.PI) * 9 * sp.s;
    ctx.fillStyle = 'rgba(200,215,235,' + (0.6 * (1 - k)) + ')';
    ctx.fillRect(sp.x - k * 8 * sp.s, sy0 - h - 1, 1.5, 1.5); ctx.fillRect(sp.x + k * 8 * sp.s, sy0 - h * .8 - 1, 1.5, 1.5);
  }
  // 바닥에 남은 핏자국
  for (const s of stains){
    ctx.fillStyle = 'rgba(110,12,12,' + (Math.min(1, (s.life - s.t) / 4) * .85) + ')';
    ctx.beginPath(); ctx.ellipse(s.x, gy(s.x) + .5, s.w, s.w * .22, 0, 0, 7); ctx.fill();
  }
  // 잔상 (발도술 + 산데비스탄)
  for (const g of ghosts){ ctx.globalAlpha = (g.p.gc ? .5 : .45) * (1 - g.t / (g.life || .3)); if (g.p.ad) drawAdam(g.p, 0, '', 1); else person(g.p, '', 1); }
  ctx.globalAlpha = 1;
  // 캐릭터 (분쇄된 캐릭터/전차 탑승 중인 캐릭터는 그리지 않음 / 내 닉네임 앞에는 🟢 온라인 표시)
  for (const id in others){ const o = others[id]; if (!o.gib){ if (o.ad) drawAdam(o, o.ah, o.n || id.slice(0, 3)); else if (o.tk >= 0) drawTank(o, o.th, o.n || id.slice(0, 3)); else person(o, o.n || id.slice(0, 3)); } }
  if (!me.gib){ if (me.ad) drawAdam(me, me.ahp, '🟢 ' + me.n); else if (me.tk >= 0) drawTank(me, me.thp, '🟢 ' + me.n); else person(me, '🟢 ' + me.n); }
  for (const id in others) drawEmote(others[id]);
  if (!me.gib) drawEmote(me);
  // 활 차징 중: 예상 포물선 궤적
  if (me.cv > 0 && me.tk < 0 && me.hp > 0 && WEAPONS[me.w].chg){
    const wp = WEAPONS[me.w], v = bowVel(wp, me.cv, me.f, me.aim), sh = isProne(me) ? 14 : me.ps === 1 ? 40 : 64;
    let px = me.x + me.f * 30, py = me.y - sh, qx = v[0], qy = v[1];
    for (let i = 0; i < 60; i++){
      qy += wp.g * .04; px += qx * .04; py += qy * .04;
      if (py > gy(px)) break;
      ctx.fillStyle = 'rgba(255,240,180,' + (.6 * (1 - i / 60)) + ')';
      ctx.beginPath(); ctx.arc(px, py, 1.7, 0, 7); ctx.fill();
    }
  }
  // 화살 / 총알 / 로켓
  ctx.lineCap = 'round';
  for (const b of bullets){
    if (b.rk){
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = '#2a2d32'; ctx.fillRect(-14, -3, 22, 6);
      ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(15, 0); ctx.lineTo(8, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,170,60,.95)'; ctx.beginPath(); ctx.arc(-17, 0, 4 + Math.random() * 3, 0, 7); ctx.fill();
      ctx.restore();
    } else {
      const full = !b.smg && b.pw > .9;   // 풀 차징 화살은 굵고 밝게
      ctx.strokeStyle = b.smg ? 'rgba(255,230,150,.95)' : full ? 'rgba(255,248,200,1)' : 'rgba(235,215,170,.95)'; ctx.lineWidth = b.smg ? 1.8 : full ? 3.4 : 2.5;
      const sp = Math.hypot(b.vx, b.vy) || 1, lx = b.bow ? b.vx / sp * 26 : b.vx * (b.smg ? .018 : .026) * Math.max(.35, wsc), ly = b.bow ? b.vy / sp * 26 : b.vy * .026;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - lx, b.y - ly); ctx.stroke();
    }
  }
  for (const m of muz){ ctx.fillStyle = 'rgba(255,230,150,' + (m.t / .08) + ')'; ctx.beginPath(); ctx.arc(m.x, m.y, 2 + 5 * m.t / .08, 0, 7); ctx.fill(); }

  // 카타나 이펙트: 발도 궤적, 베기 호, 검기
  for (const s of slashes){
    const k = s.t / .3, a = 1 - k, hx = lerp(s.x1, s.x2, Math.min(1, k * 4));
    ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = '#9fe0ff'; ctx.shadowBlur = 16;
    ctx.strokeStyle = 'rgba(255,255,255,' + a + ')'; ctx.lineWidth = 7 * a + 1;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y); ctx.lineTo(hx, s.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,220,255,' + (a * .6) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y - 9); ctx.lineTo(hx, s.y - 4); ctx.stroke(); ctx.restore();
  }
  for (const a of arcs){
    const k = a.t / .22, r = (a.big ? 74 : 58) * (.85 + k * .25);
    ctx.save(); ctx.translate(a.x + a.f * 26, a.y - 50); ctx.scale(a.f, 1); ctx.lineCap = 'round'; ctx.shadowColor = '#9fe0ff'; ctx.shadowBlur = 12;
    ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')'; ctx.lineWidth = (a.big ? 7 : 4) * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(-14, 0, r, -1.15, 1.15); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,220,255,' + (.5 * (1 - k)) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-14, 0, r + 8, -1, 1); ctx.stroke(); ctx.restore();
  }
  for (const w of waves){
    const a = Math.min(1, (w.life - w.t) / .25);
    ctx.save(); ctx.translate(w.x, w.y); ctx.scale(w.f, 1); ctx.lineCap = 'round'; ctx.shadowColor = '#8fdcff'; ctx.shadowBlur = 14;
    for (let k = 3; k >= 1; k--){ ctx.strokeStyle = 'rgba(150,215,255,' + (a * .3) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(-26 - k * 14, 0, 50, -.8, .8); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(190,235,255,' + a + ')'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(-26, 0, 50, -1, 1); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + a + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-26, 0, 50, -.9, .9); ctx.stroke(); ctx.restore();
  }
  // 이펙트: 먼지, 파편, 바람줄기, 충격파
  for (const d of dust){
    ctx.fillStyle = 'rgba(105,110,120,' + (.35 * (1 - d.t / d.max)) + ')';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
  }
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(150,156,168,.5)'; ctx.fillStyle = '#08090a';
  for (const d of debris){
    ctx.globalAlpha = Math.min(1, (d.life - d.t) / .4);
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.beginPath(); ctx.moveTo(-d.s, -d.s * .5); ctx.lineTo(d.s * .8, -d.s * .7); ctx.lineTo(d.s * .4, d.s * .6); ctx.lineTo(-d.s * .7, d.s * .4); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // 분쇄된 신체 조각
  for (const g of gibs){
    ctx.globalAlpha = Math.min(1, (g.life - g.age) / 1.5);
    ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot);
    if (g.t === 'h'){
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(160,18,18,.85)'; ctx.beginPath(); ctx.arc(5, 2, 4.5, 0, 7); ctx.fill();
    } else if (g.t === 'l'){
      ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-g.l / 2, 0); ctx.lineTo(g.l / 2, 0); ctx.stroke();
      ctx.fillStyle = '#a01818'; ctx.beginPath(); ctx.arc(g.l / 2, 0, 3.3, 0, 7); ctx.fill();
    } else { ctx.fillStyle = g.c; ctx.beginPath(); ctx.arc(0, 0, g.r, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  for (const s of streaks){
    const f = s.vx > 0 ? 1 : -1;
    ctx.strokeStyle = 'rgba(225,233,248,' + (.6 * (1 - s.t / .3)) + ')';
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - f * s.len, s.y); ctx.stroke();
  }
  for (const r of rings){
    const k = r.t / .45, rr = (10 + k * 170) * (r.s || 1), a = 1 - k;
    ctx.save(); ctx.translate(r.x, r.y); ctx.scale(r.f, 1);
    ctx.strokeStyle = 'rgba(235,242,255,' + (.8 * a) + ')'; ctx.lineWidth = 1 + 3 * a;
    ctx.beginPath(); ctx.ellipse(0, 0, rr * .55, rr, 0, -1.2, 1.2); ctx.stroke();
    ctx.strokeStyle = 'rgba(235,242,255,' + (.4 * a) + ')'; ctx.lineWidth = 1 + 1.5 * a;
    ctx.beginPath(); ctx.ellipse(-rr * .2, 0, rr * .4, rr * .75, 0, -1.2, 1.2); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(200,210,225,' + (.45 * a) + ')'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(r.x, gy(r.x), rr * 1.3, rr * .16, 0, 0, 7); ctx.stroke();
  }
  // 폭발 불덩이
  for (const e of fires){
    const k = e.t / .5, r = e.r * (.4 + .7 * Math.sqrt(k)), a = 1 - k;
    const fg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
    fg.addColorStop(0, 'rgba(255,250,210,' + a + ')'); fg.addColorStop(.35, 'rgba(255,170,50,' + (a * .9) + ')');
    fg.addColorStop(.7, 'rgba(200,60,20,' + (a * .5) + ')'); fg.addColorStop(1, 'rgba(60,20,10,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, 7); ctx.fill();
  }
  // 타격 번쩍임 + 스파크 + 데미지 숫자
  for (const b of bursts){
    const k = b.t / .14, a = 1 - k;
    ctx.strokeStyle = 'rgba(' + b.c + ',' + a + ')'; ctx.lineWidth = 2.2 * a + .6; ctx.lineCap = 'round'; ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const an = i * Math.PI / 4 + b.r, r0 = b.r * .35 * (1 + k), r1 = b.r * (.6 + k * .9);
      ctx.moveTo(b.x + Math.cos(an) * r0, b.y + Math.sin(an) * r0); ctx.lineTo(b.x + Math.cos(an) * r1, b.y + Math.sin(an) * r1);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + (a * .8) + ')'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .5 * (1 - k * .4), 0, 7); ctx.fill();
  }
  for (const m of mists){
    ctx.fillStyle = 'rgba(150,15,15,' + (.35 * (1 - m.t / m.max)) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill();
  }
  for (const b of blood){
    ctx.fillStyle = 'rgba(175,22,22,' + Math.min(1, (b.life - b.t) / .3) + ')';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  }
  for (const s of sparks){
    ctx.strokeStyle = 'rgba(' + s.c + ',' + Math.max(0, 1 - s.t / s.life) + ')'; ctx.lineWidth = s.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * .03, s.y - s.vy * .03); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const tx of texts){
    const a = Math.min(1, (.75 - tx.t) / .25), pop = tx.t < .08 ? 1 + (1 - tx.t / .08) * .5 : 1;
    ctx.globalAlpha = a; ctx.font = 'bold ' + Math.round(tx.sz * pop) + 'px system-ui';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(tx.v, tx.x, tx.y);
    ctx.fillStyle = tx.c; ctx.fillText(tx.v, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;

  // 비 (화면 좌표) - 산데비스탄 중엔 느리게 내림
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  rain(rdt * wsc);
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.25, W / 2, H * 0.55, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // 산데비스탄 화면 연출: 시간이 느려질수록 푸른 톤 + 가장자리 색 번짐 (내가 켜면 붉은색, 남이 켜면 청색)
  const sk = Math.max(0, Math.min(1, (1 - wsc) / (1 - SV_SLOW)));
  if (sk > .01){
    ctx.fillStyle = 'rgba(10,40,70,' + (.2 * sk) + ')'; ctx.fillRect(0, 0, W, H);
    const ec = me.sv ? '255,30,90' : '30,200,255';
    const sg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.2, W / 2, H * 0.55, Math.max(W, H) * 0.7);
    sg.addColorStop(0, 'rgba(' + ec + ',0)'); sg.addColorStop(1, 'rgba(' + ec + ',' + (.38 * sk) + ')');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
    if (me.sv){   // 속도선
      ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < 10; i++){ const yy = Math.random() * H, xx = Math.random() * W, ll = 60 + Math.random() * 160; ctx.moveTo(xx, yy); ctx.lineTo(xx - me.f * ll, yy); }
      ctx.stroke();
    }
  }
  if (ifl > .01){ ctx.fillStyle = 'rgba(255,255,255,' + ifl + ')'; ctx.fillRect(0, 0, W, H); }
  ifl = Math.max(0, ifl - rdt * 2);

  updateBtns();
  bk1El.style.opacity = me.kc1 > 0 ? .35 : 1; bk2El.style.opacity = me.kc2 > 0 ? .35 : 1;
  hpEl.style.width = (me.ad ? me.ahp / ADAM_HP * 100 : me.tk >= 0 ? me.thp / TANK_HP * 100 : me.hp) + '%'; hpEl.style.background = me.ad ? '#e03030' : me.tk >= 0 ? '#c8892a' : '#a33';
  ggEl.style.width = me.gg + '%'; ggEl.style.background = me.glock ? '#b7793a' : '#5a8fc7';
  svEl.style.width = me.svE + '%'; svEl.style.background = me.sv ? '#ff2a6d' : me.svLock ? '#b7793a' : '#05d9e8';
  { const wp = WEAPONS[me.w]; wlEl.textContent = wp.ic + ' ' + wp.n + (wp.t === 'r' ? '  ' + (me.rlOn ? '장전 중…' : me.ammo[me.w] + '/' + wp.max) : '') + (me.bc > 0 ? ' · 각도 ' + Math.round(me.aim * 57.3) + '°' : '') + (me.lg >= 2 ? ' · 기어가는 중' : me.lg ? ' · 다리 부상' : '') + (me.ps === 2 ? ' · 엎드림' : me.ps === 1 ? ' · 앉음' : '');
    if (me.ad) wlEl.textContent = '🦾 아담 스매셔 ' + Math.round(me.ahp) + '/' + ADAM_HP + ' · ' + Math.ceil(me.adT) + '초';
    else if (me.tk >= 0) wlEl.textContent = '🚙 전차 ' + Math.round(me.thp) + '/' + TANK_HP + (me.cd > 0 ? ' · 장전 중…' : ''); }
  msgEl.textContent = !started ? '' : (!configured ? '🔴 오프라인\n(Supabase 키 미설정)' : online ? '🟢 ' + (Object.keys(others).length + 1) + '명 접속' : '🟠 연결 중…') + (svAny ? (me.sv ? '\n⏱ 산데비스탄 작동 중' : '\n⏱ 시간 지연 중') : '');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
